root_page:
  project: Climate Control Niva Travel
  version: '2.5'
  file: climate_control_niva_travel.kicad_sch

    # ─────────────────────────────────────────────────────────────────
  # SPICE-конфигурация проекта
  #
  # lib_dir         — каталог с .lib/.model относительно корня проекта
  #
  # component_models — сложные компоненты со .SUBCKT. Каждый знает:
  #     description   — что это и что моделируется
  #     include       — файл .lib в lib_dir
  #     subckt        — имя .SUBCKT внутри файла
  #     nodes         — KiCad pin → SPICE port (порядок = порядок портов)
  #     required_params — параметры, обязательные в каждом инстансе
  #                       (передаются в deck сценария через params:)
  #
  # models          — переиспользуемые .model для пассивных компонентов.
  #                   Подставляются в .cir при первом использовании.
  # ─────────────────────────────────────────────────────────────────
  spice:
    lib_dir: "spice/lib"

    component_models:

      DRV8871DDA:
        description: |
          H-мост 3.6А с токоограничением и защитой от перегрузки/перегрева,
          Texas Instruments DRV8871 (SOIC-8).

          Моделируется: два полумоста OUT1/OUT2 с Rds_on ~0.5Ω;
          логика IN1/IN2 (forward / reverse / coast / brake); порог
          токоограничения по входу ILIM (pin 4).

          Не моделируется: тепловой дрейф Rds_on и тока ограничения,
          время переключения плеч, ток покоя по VM.
        include: drv8871_ngspice.lib
        subckt: DRV8871
        nodes:
          IN1:  { pin: "3" }
          IN2:  { pin: "2" }
          OUT1: { pin: "6" }
          OUT2: { pin: "8" }
          VM:   { pin: "5" }
          GND:  { pin: "1" }
        required_params: []

      MCP2562-E-SN:
        description: |
          CAN-трансивер 5В, до 1 Мбит/с, Microchip MCP2562-E-SN (SOIC-8).

          Моделируется: драйвер TXD → CANH/CANL (доминанта Vdiff ~2В,
          рецессив ~0В); приёмник CANH/CANL → RXD; вход STBY.

          Не моделируется: паразитные ёмкости шины, защита от КЗ
          CANH/CANL, loop-back задержки, джиттер.
        include: mcp2562_ngspice.lib
        subckt: MCP2562
        nodes:
          TXD:  { pin: "1" }
          RXD:  { pin: "4" }
          CANH: { pin: "7" }
          CANL: { pin: "6" }
          STBY: { pin: "5" }
          VDD:  { pin: "3" }
          VIO:  { pin: "8" }
          GND:  { pin: "2" }
        required_params: []

      LM78M05_TO252:
        description: |
          Линейный стабилизатор +5В, 0.5А, MC78M05CDTG (TO-252).

          Моделируется: выход 5В ±2% в диапазоне 0..0.5А; падение
          Vin−Vout ~2В при полной нагрузке; ограничение тока ~0.6А
          (поведенческое, без тепловой обратной связи).

          Не моделируется: thermal shutdown, гистерезис, шум,
          PSRR по частоте.
        include: mc78m05_ngspice.lib
        subckt: MC78M05
        nodes:
          IN:  { pin: "1" }
          GND: { pin: "2" }
          OUT: { pin: "3" }
        required_params: []

      AP1117-15:
        description: |
          LDO +3.3В, 1А, AMS1117-3.3 (SOT-223).

          Моделируется: выход 3.3В ±1% при 0..1А; падение Vin−Vout
          ~1.1В при полной нагрузке; ограничение тока ~1.2А.

          Не моделируется: thermal shutdown, частотная зависимость
          PSRR и выходного импеданса.
        include: ams1117_33_ngspice.lib
        subckt: AMS1117_33
        nodes:
          IN:  { pin: "1" }
          GND: { pin: "2" }
          OUT: { pin: "3" }
        required_params: []

      BTS141:
        description: |
          Smart low-side switch, 12В / 40А, Infineon BTS141 (TO-252).

          Моделируется: N-канальный MOSFET с Rds_on ~15 мОм; активный
          уровень IN = лог. 1; защита от КЗ (порог ~40А, отключение);
          защита от перегрева (~175°C, отключение); автоматическое
          восстановление после снятия аварии.

          Не моделируется: точная динамика тепловой модели кристалла;
          конечное время реакции защиты.
        include: bts141_ngspice.lib
        subckt: BTS141
        nodes:
          IN:  { pin: "1" }
          OUT: { pin: "2" }
          GND: { pin: "3" }
        required_params: []

      Thermistor_NTC:
        description: |
          NTC-термистор 10к B3435.

          R(T) = R25 · exp(BETA · (1/(273.15+T) − 1/298.15))
          Характерные точки:
            0°C   ≈ 27.2 кОм
            25°C  = 10 кОм
            60°C  ≈  2.49 кОм
            85°C  ≈  1.27 кОм

          Параметр T (температура) задаётся в deck сценария — это
          позволяет одному и тому же .subckt давать разные результаты
          в разных тестовых точках.
        include: ntc_models.lib
        subckt: NTC_10K_3435
        nodes:
          A: { pin: "1" }
          B: { pin: "2" }
        required_params:
          - { name: T,    unit: "°C", description: "температура термистора" }
          - { name: R25,  unit: "Ω",  description: "номинальное сопротивление при 25°C" }
          - { name: BETA, unit: "K",  description: "коэффициент B" }

      DC_MOTOR:
        description: |
          Универсальная электромеханическая модель коллекторного мотора.

          Электрика:  R_arm (обмотка) + L_arm (индуктивность) + B_emf
                      (back-EMF = Ke · V(Speed)).
          Механика (электро-механическая аналогия):
                      C_inertia (инерция ротора),
                      R_friction (вязкое трение и нагрузка),
                      B_torque = Kt·I_arm (нагнетает заряд в Speed).
          Нормировка: 1В на узле Speed = 1000 об/мин.

          Числовых дефолтов нет — все параметры обязательны в deck,
          чтобы в сценарии всегда было явно видно, с каким мотором
          ведётся прогон (мотор печки / заслонки / рециркуляции).
        include: motor_model.lib
        subckt: DC_MOTOR
        nodes:
          INP:   { pin: "In+" }
          INN:   { pin: "In-" }
          SPEED: { pin: "Speed" }
        required_params:
          - { name: R_arm,      unit: "Ω",  description: "сопротивление обмотки" }
          - { name: L_arm,      unit: "H",  description: "индуктивность обмотки" }
          - { name: Ke,         unit: "—",  description: "back-EMF на 1В Speed" }
          - { name: Kt,         unit: "—",  description: "момент на 1А якоря" }
          - { name: C_inertia,  unit: "—",  description: "инерция ротора" }
          - { name: R_friction, unit: "Ω",  description: "вязкое трение и нагрузка" }

    models:
      LED_WHITE:
        model_def: ".model LED_WHITE D(IS=1e-22 N=2.5 RS=6 BV=5 CJO=10p)"
        description: |
          Белый светодиод 0805/1206/0603.
          Vf ≈ 3.2В при 20 мА; 3 LED последовательно ≈ 9.6В.
          Используется во всех каналах backlight и в индикаторах UI.

      D_1N4148:
        model_def: ".model D_1N4148 D(IS=2.52e-9 N=1.752 RS=0.568 CJO=4p BV=100)"
        description: |
          Малосигнальный кремниевый диод 100В / 300мА.
          Используется в SEN_CABIN (D3) и как опорный диод.
  
