    { "order": 3, "name": "PWR", "file": "cc_03_pwr.kicad_sch" },
    { "order": 11, "name": "FAN_KEY", "file": "cc_11_fan_key.kicad_sch" },
    { "order": 12, "name": "ILLUM", "file": "cc_12_illum.kicad_sch" }
  ],
  "components": {
    "$include": [
      "sheets/01_controller.json",
      "sheets/03_pwr.json",
      "sheets/11_fan_key.json",
      "sheets/12_illum.json"
    ]
  },
  "nets": {
    "$include": [
      "sheets/nets_global.json",
      "sheets/nets_illum.json"
    ]
  }
}

