    description: "Кнопка «воздух в ноги»"
  SW4:
    type: TYPE_SWPUSH_6X6
    description: "Кнопка «сушка стекла»"
  SW5:
    type: TYPE_SWPUSH_6X6
    description: "Кнопка «кондиционер»"
  SW6:
    type: TYPE_SWPUSH_6X6
    description: "Кнопка «рециркуляция»"

nets:
  VCC_3V3:
    name: VCC_3V3
    description: Логическое питание +3,3В микроконтроллера и фронт-панели
    is_hierarchical_port: true
    attributes:
      type: POWER
      voltage_level: 3.3V
      current_max: 0.3A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: R22, pin: '1' }
    - { component: R23, pin: '1' }
    - { component: R24, pin: '1' }
    - { component: R7,  pin: '1' }
    - { component: R8,  pin: '1' }
    - { component: R9,  pin: '1' }
    - { component: R10, pin: '1' }
    - { component: R11, pin: '1' }
    - { component: R12, pin: '1' }

  GND:
    name: GND
    description: Общий провод (кузов автомобиля)
    is_hierarchical_port: true
    attributes:
      type: GND
      voltage_level: 0V
      current_max: 15A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: SW1, pin: '2' }
    - { component: SW2, pin: '2' }
    - { component: SW3, pin: '2' }
    - { component: SW4, pin: '2' }
    - { component: SW5, pin: '2' }
    - { component: SW6, pin: '2' }
    - { component: J3,  pin: '2' }
    - { component: J4,  pin: '1' }    # общий провод галлетника
    - { component: C22, pin: '2' }
    - { component: C23, pin: '2' }
    - { component: C24, pin: '2' }
    - { component: R40, pin: '2' }
    - { component: C32, pin: '2' }

  # ─── Кнопки ────────────────────────────────────────────────────
  BTN_DEFROST_GLASS:
    name: BTN_DEFROST_GLASS
    description: 'Кнопка: воздух на стекло'
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.02A }
    nodes:
    - { component: SW1, pin: '1' }
  BTN_FACE:
    name: BTN_FACE
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.02A }
    nodes:
    - { component: SW2, pin: '1' }
  BTN_FEET:
    name: BTN_FEET
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.02A }
    nodes:
    - { component: SW3, pin: '1' }
  BTN_DRY_GLASS:
    name: BTN_DRY_GLASS
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.02A }
    nodes:
    - { component: SW4, pin: '1' }
  BTN_AC:
    name: BTN_AC
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.02A }
    nodes:
    - { component: SW5, pin: '1' }
  BTN_RECIRC:
    name: BTN_RECIRC
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.02A }
    nodes:
    - { component: SW6, pin: '1' }

  # ─── Индикаторы режимов ────────────────────────────────────────
  LED_DEFROST_GLASS_A:
    name: LED_DEFROST_GLASS_A
    is_hierarchical_port: false
    attributes: { type: ANALOG_SIGNAL, voltage_level: 0..3.3V }
    nodes:
    - { component: R7,   pin: '2' }
    - { component: LED1, pin: '1' }
  LED_DEFROST_GLASS_DRV:
    name: LED_DEFROST_GLASS_DRV
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.005A }
    nodes:
    - { component: LED1, pin: '2' }

  LED_FACE_A:
    name: LED_FACE_A
    is_hierarchical_port: false
    attributes: { type: ANALOG_SIGNAL, voltage_level: 0..3.3V }
    nodes:
    - { component: R8,   pin: '2' }
    - { component: LED2, pin: '1' }
  LED_FACE_DRV:
    name: LED_FACE_DRV
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.005A }
    nodes:
    - { component: LED2, pin: '2' }

  LED_FEET_A:
    name: LED_FEET_A
    is_hierarchical_port: false
    attributes: { type: ANALOG_SIGNAL, voltage_level: 0..3.3V }
    nodes:
    - { component: R9,   pin: '2' }
    - { component: LED3, pin: '1' }
  LED_FEET_DRV:
    name: LED_FEET_DRV
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.005A }
    nodes:
    - { component: LED3, pin: '2' }

  LED_DRY_GLASS_A:
    name: LED_DRY_GLASS_A
    is_hierarchical_port: false
    attributes: { type: ANALOG_SIGNAL, voltage_level: 0..3.3V }
    nodes:
    - { component: R10,  pin: '2' }
    - { component: LED4, pin: '1' }
  LED_DRY_GLASS_DRV:
    name: LED_DRY_GLASS_DRV
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.005A }
    nodes:
    - { component: LED4, pin: '2' }

  LED_AC_A:
    name: LED_AC_A
    is_hierarchical_port: false
    attributes: { type: ANALOG_SIGNAL, voltage_level: 0..3.3V }
    nodes:
    - { component: R11,  pin: '2' }
    - { component: LED5, pin: '1' }
  LED_AC_DRV:
    name: LED_AC_DRV
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.005A }
    nodes:
    - { component: LED5, pin: '2' }

  LED_RECIRC_A:
    name: LED_RECIRC_A
    is_hierarchical_port: false
    attributes: { type: ANALOG_SIGNAL, voltage_level: 0..3.3V }
    nodes:
    - { component: R12,  pin: '2' }
    - { component: LED6, pin: '1' }
  LED_RECIRC_DRV:
    name: LED_RECIRC_DRV
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.005A }
    nodes:
    - { component: LED6, pin: '2' }

  # ─── АЦП-входы ─────────────────────────────────────────────────
  TEMP_SET_ADC:
    name: TEMP_SET_ADC
    description: АЦП задания температуры (внешний потенциометр)
    is_hierarchical_port: true
    attributes: { type: ANALOG_SIGNAL, voltage_level: 0..3.3V, current_max: 0.005A }
    nodes:
    - { component: J3,  pin: '1' }
    - { component: R22, pin: '2' }
    - { component: C22, pin: '1' }

  # ─── Галлетник скорости вентилятора ────────────────────────────
  GALLET_POS_1:
    name: GALLET_POS_1
    description: Контакт галлетника — позиция 1 скорости
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.001A }
    nodes:
    - { component: J4,      pin: '2' }
    - { component: R_SEL_1, pin: '1' }

  GALLET_POS_2:
    name: GALLET_POS_2
    description: Контакт галлетника — позиция 2 скорости
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.001A }
    nodes:
    - { component: J4,      pin: '3' }
    - { component: R_SEL_2, pin: '1' }

  GALLET_POS_3:
    name: GALLET_POS_3
    description: Контакт галлетника — позиция 3 скорости
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.001A }
    nodes:
    - { component: J4,      pin: '4' }
    - { component: R_SEL_3, pin: '1' }

  GALLET_POS_4:
    name: GALLET_POS_4
    description: Контакт галлетника — позиция 4 скорости
    is_hierarchical_port: true
    attributes: { type: DIGITAL_SIGNAL, voltage_level: 0..3.3V, current_max: 0.001A }
    nodes:
    - { component: J4,      pin: '5' }
    - { component: R_SEL_4, pin: '1' }

  FAN_SEL_ADC:
    name: FAN_SEL_ADC
    description: |
      АЦП скорости вентилятора. Кодировка через резисторы ступеней:
      R_SEL_1..4 на плате, замыкаются контактами галлетника на GND.
      Подтяжка R23 (10к) к +3,3В, фильтр C23.
    is_hierarchical_port: true
    attributes: { type: ANALOG_SIGNAL, voltage_level: 0..3.3V, current_max: 0.005A }
    nodes:
    - { component: R23,     pin: '2' }
    - { component: R_SEL_1, pin: '2' }
    - { component: R_SEL_2, pin: '2' }
    - { component: R_SEL_3, pin: '2' }
    - { component: R_SEL_4, pin: '2' }
    - { component: C23,     pin: '1' }

  NTC_CABIN:
    name: NTC_CABIN
    description: Температура воздуха в салоне (верхнее плечо R24, NTC — на SEN_CABIN)
    is_hierarchical_port: true
    attributes: { type: ANALOG_SIGNAL, voltage_level: 0..3.3V, current_max: 0.005A }
    nodes:
    - { component: R24, pin: '2' }
    - { component: C24, pin: '1' }

  # ─── Детектор габаритов ────────────────────────────────────────
  ILLUM_IN_RAW:
    name: ILLUM_IN_RAW
    description: |
      Аналоговое питание подсветки с внешнего регулятора яркости
      (J1:22). Диапазон 1..14,4В. Используется только для
      детектора габаритов через делитель R39/R40.
    is_hierarchical_port: true
    attributes:
      type: POWER
      voltage_level: 1.0..14.4V
      current_max: 0.5A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: R39, pin: '1' }

  ILLUM_SENSE:
    name: ILLUM_SENSE
    description: Сигнал подсветки после делителя R39/R40 на вход АЦП МК
    is_hierarchical_port: true
    attributes: { type: ANALOG_SIGNAL, voltage_level: 0..2.6V, current_max: 0.005A }
    nodes:
    - { component: R39, pin: '2' }
    - { component: R40, pin: '1' }
    - { component: C32, pin: '1' }

spice:
  models:
    - "LED_GREEN D(IS=1e-20 N=1.8 RS=8 BV=5 CJO=10p)"
    - "LED_AMBER D(IS=1e-20 N=1.8 RS=8 BV=5 CJO=10p)"
    - "SW_GP    SW(Ron=0.1 Roff=1Meg Vt=1.5 Vh=0.5)"

# ─────────────────────────────────────────────────────────────────────
# Тестовые сценарии Ngspice
#
# Галлетник эмулируется замыканием соответствующего контакта
# GALLET_POS_N на GND (V-источник 0В). Резисторы ступеней R_SEL_*
# уже внутри .sub.
#
# Кодировка FAN_SEL_ADC:
#   AUTO (все разомкнуты)      → 3,30В (только R23)
#   Позиция 1 (R_SEL_1 = 20к)  → 2,20В
#   Позиция 2 (R_SEL_2 = 10к)  → 1,65В
#   Позиция 3 (R_SEL_3 = 4,7к) → 1,05В
#   Позиция 4 (R_SEL_4 = 1к)   → 0,30В
# ─────────────────────────────────────────────────────────────────────

scenarios:

  # ─── Галлетник ─────────────────────────────────────────────────

  - name: UI_FAN_AUTO
    description: |
      Галлетник в положении AUTO — ни один контакт не замкнут.
      FAN_SEL_ADC подтянут к +3,3В через R23.
    analysis: op
    deck:
      - source: { ref: V1, net: VCC_3V3, type: dc, value: 3.3,
                  description: "Питание подтяжки R23" }
    checks:
      - { node: v(fan_sel_adc), min: 3.20, max: 3.40,
          description: "AUTO → 3,3В (все контакты разомкнуты)" }

  - name: UI_FAN_POS_1
    description: |
      Галлетник в позиции 1 — замкнут GALLET_POS_1 на GND.
      Делитель R23 (10к) / R_SEL_1 (20к) → 2,20В.
    analysis: op
    deck:
      - source: { ref: V1, net: VCC_3V3, type: dc, value: 3.3,
                  description: "Питание подтяжки" }
      - source: { ref: V_G1, net: GALLET_POS_1, type: dc, value: 0.0,
                  description: "Галлетник в позиции 1: замкнут POS_1" }
    checks:
      - { node: v(fan_sel_adc), min: 2.10, max: 2.30,
          description: "позиция 1 → 2,20В" }

  - name: UI_FAN_POS_2
    description: |
      Галлетник в позиции 2 — замкнут GALLET_POS_2.
      Делитель R23 / R_SEL_2 (10к) → 1,65В.
    analysis: op
    deck:
      - source: { ref: V1, net: VCC_3V3, type: dc, value: 3.3 }
      - source: { ref: V_G2, net: GALLET_POS_2, type: dc, value: 0.0,
                  description: "Галлетник в позиции 2: замкнут POS_2" }
    checks:
      - { node: v(fan_sel_adc), min: 1.55, max: 1.75,
          description: "позиция 2 → 1,65В" }

  - name: UI_FAN_POS_3
    description: |
      Галлетник в позиции 3. R_SEL_3 (4,7к) → 1,05В.
    analysis: op
    deck:
      - source: { ref: V1, net: VCC_3V3, type: dc, value: 3.3 }
      - source: { ref: V_G3, net: GALLET_POS_3, type: dc, value: 0.0,
                  description: "Галлетник в позиции 3: замкнут POS_3" }
    checks:
      - { node: v(fan_sel_adc), min: 0.95, max: 1.15,
          description: "позиция 3 → 1,05В" }

  - name: UI_FAN_POS_4
    description: |
      Галлетник в позиции 4 (максимум). R_SEL_4 (1к) → 0,30В.
    analysis: op
    deck:
      - source: { ref: V1, net: VCC_3V3, type: dc, value: 3.3 }
      - source: { ref: V_G4, net: GALLET_POS_4, type: dc, value: 0.0,
                  description: "Галлетник в позиции 4: замкнут POS_4" }
    checks:
      - { node: v(fan_sel_adc), min: 0.25, max: 0.40,
          description: "позиция 4 → 0,30В" }

  # ─── Детектор габаритов ────────────────────────────────────────

  - name: UI_ILLUM_OFF
    description: Диммер на минимуме (1В) → ILLUM_SENSE ≈ 0,18В (ниже порога)
    analysis: op
    deck:
      - source: { ref: V1, net: ILLUM_IN_RAW, type: dc, value: 1.0 }
    checks:
      - { node: v(illum_sense), min: 0.0, max: 0.30 }

  - name: UI_ILLUM_MID
    description: Средняя яркость (5В) → ILLUM_SENSE ≈ 0,88В
    analysis: op
    deck:
      - source: { ref: V1, net: ILLUM_IN_RAW, type: dc, value: 5.0 }
    checks:
      - { node: v(illum_sense), min: 0.75, max: 1.00 }

  - name: UI_ILLUM_ON
    description: Номинальная яркость (12В) → ILLUM_SENSE ≈ 2,11В
    analysis: op
    deck:
      - source: { ref: V1, net: ILLUM_IN_RAW, type: dc, value: 12.0 }
    checks:
      - { node: v(illum_sense), min: 1.95, max: 2.25 }

  - name: UI_ILLUM_HIGH
    description: Максимум при генераторе (14,4В) → ILLUM_SENSE ≈ 2,53В
    analysis: op
    deck:
      - source: { ref: V1, net: ILLUM_IN_RAW, type: dc, value: 14.4 }
    checks:
      - { node: v(illum_sense), min: 2.40, max: 2.65 }

  # ─── Задание температуры ───────────────────────────────────────

  - name: UI_TEMP_OPEN
    description: Потенциометр отключён, R22 подтягивает к 3,3В
    analysis: op
    deck:
      - source: { ref: V1, net: VCC_3V3, type: dc, value: 3.3 }
    checks:
      - { node: v(temp_set_adc), min: 3.20, max: 3.40 }

  - name: UI_TEMP_MID
    description: Потенциометр в середине (10к) → 1,65В
    analysis: op
    deck:
      - source: { ref: V1, net: VCC_3V3, type: dc, value: 3.3 }
      - resistor: { ref: R_POT, net_pos: TEMP_SET_ADC, net_neg: "0",
                    value: 10k }
    checks:
      - { node: v(temp_set_adc), min: 1.55, max: 1.75 }

  - name: UI_TEMP_MIN
    description: Потенциометр на минимуме (100Ω) → ~0В
    analysis: op
    deck:
      - source: { ref: V1, net: VCC_3V3, type: dc, value: 3.3 }
      - resistor: { ref: R_POT, net_pos: TEMP_SET_ADC, net_neg: "0",
                    value: 100 }
    checks:
      - { node: v(temp_set_adc), min: 0.0, max: 0.10 }

  # ─── Индикаторы режимов ────────────────────────────────────────

  - name: UI_LED_ON
    description: Индикатор LED1 включён (катод прижат МК к GND)
    analysis: op
    deck:
      - source: { ref: V1, net: VCC_3V3, type: dc, value: 3.3 }
      - source: { ref: V2, net: LED_DEFROST_GLASS_DRV, type: dc, value: 0.0 }
    control: |
      let icc = -i(V1)
      print icc
    checks:
      - { node: icc, min: 0.0008, max: 0.0015,
          description: "ток через LED1 ≈ 1,2 мА" }

  - name: UI_LED_OFF
    description: Индикатор LED1 выключен (катод на 3,3В с МК)
    analysis: op
    deck:
      - source: { ref: V1, net: VCC_3V3, type: dc, value: 3.3 }
      - source: { ref: V2, net: LED_DEFROST_GLASS_DRV, type: dc, value: 3.3 }
    control: |
      let icc = -i(V1)
      print icc
    checks:
      - { node: icc, min: -0.0001, max: 0.0001 }