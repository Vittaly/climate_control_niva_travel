    type: TYPE_C_100NF
    description: "Фильтр входа детектора габаритов"
  J3:
    type: TYPE_CONN01X02_ПОТЕНЦИОМЕТР
    description: "Внутренний коннектор потенциометра задания температуры"
  J4:
    type: TYPE_CONN01X05_ГАЛЛЕТНИК
    description: |
      Внутренний коннектор галлетника скорости вентилятора.
      Pin 1 — общий (GND), pin 2..5 — сигналы позиций 1..4.
  LED1:
    type: TYPE_LED_GREEN_1206
    description: "Индикатор кнопки SW1 (DEFROST_GLASS)"
  LED2:
    type: TYPE_LED_GREEN_1206
    description: "Индикатор кнопки SW2 (FACE)"
  LED3:
    type: TYPE_LED_GREEN_1206
    description: "Индикатор кнопки SW3 (FEET)"
  LED4:
    type: TYPE_LED_AMBER_1206
    description: "Индикатор кнопки SW4 (DRY_GLASS)"
  LED5:
    type: TYPE_LED_GREEN_1206
    description: "Индикатор кнопки SW5 (AC)"
  LED6:
    type: TYPE_LED_GREEN_1206
    description: "Индикатор кнопки SW6 (RECIRC)"
  R7:
    type: TYPE_R_1K
    description: "Токоограничение индикатора LED1"
  R8:
    type: TYPE_R_1K
    description: "Токоограничение индикатора LED2"
  R9:
    type: TYPE_R_1K
    description: "Токоограничение индикатора LED3"
  R10:
    type: TYPE_R_1K
    description: "Токоограничение индикатора LED4"
  R11:
    type: TYPE_R_1K
    description: "Токоограничение индикатора LED5"
  R12:
    type: TYPE_R_1K
    description: "Токоограничение индикатора LED6"
  R22:
    type: TYPE_R_10K
    description: "Подтяжка потенциометра задания температуры"
  R23:
    type: TYPE_R_10K
    description: "Подтяжка FAN_SEL_ADC к VCC_3V3 (верхнее плечо делителя галлетника)"
  R24:
    type: TYPE_R_10K
    description: "Подтяжка NTC салона (верхнее плечо, сам NTC — на SEN_CABIN)"
  R39:
    type: TYPE_R_47K
    description: "Делитель входа детектора габаритов, верхнее плечо"
  R40:
    type: TYPE_R_10K
    description: "Делитель входа детектора габаритов, нижнее плечо"
  R_SEL_1:
