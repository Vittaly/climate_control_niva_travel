page_name: UI
file: user_interface.kicad_sch
functional_purpose: |
  Модуль пользовательского интерфейса: шесть тактовых кнопок,
  шесть светодиодов-индикаторов режимов, входы АЦП задания
  температуры, скорости вентилятора, температуры салона
  и детектор включения габаритов.

  Галлетник скорости вентилятора (J4):
    * Внешний 5-позиционный переключатель с общим проводом.
    * С галлетника идут ТОЛЬКО сигнальные провода — по одному
      на каждую скорость (1..4) плюс общий на GND.
    * Резисторы ступеней R_SEL_1..R_SEL_4 находятся на плате.
    * Каждый резистор через свой контакт галлетника замыкается
      на GND, формируя делитель с подтяжкой R23 (10к к +3,3В).
    * AUTO — положение, при котором ни один контакт не замкнут,
      FAN_SEL_ADC = 3,3В через R23.

  Кодировка напряжений на FAN_SEL_ADC:
    AUTO (все разомкнуты)          → 3,30 В
    Позиция 1 (R_SEL_1 = 20к)      → 2,20 В
    Позиция 2 (R_SEL_2 = 10к)      → 1,65 В
    Позиция 3 (R_SEL_3 = 4,7к)     → 1,05 В
    Позиция 4 (R_SEL_4 = 1к)       → 0,30 В

  Детектор габаритов:
    * Делитель R39 (47к) / R40 (10к) от ILLUM_IN_RAW (1..14,4В)
      к GND даёт ILLUM_SENSE ≈ 0,175 · V_ILLUM.
    * Порог срабатывания задаётся прошивкой МК.

  Задание температуры:
    * J3 — внешний потенциометр. R22 (10к) — подтяжка к +3,3В.

  Кнопки и индикаторы:
    * SW1..SW6 — тактовые, замыкают BTN_* на GND (подтяжка на МК).
    * R7..R12 (1к) + LED1..LED6 — индикаторы через VCC_3V3,
      катоды управляются с МК активным низким уровнем.

ports:
- net_label: VCC_3V3
  type: POWER
  description: Логическое питание +3,3В микроконтроллера и фронт-панели
- net_label: GND
  type: POWER
  description: Общий провод (кузов автомобиля)
- net_label: BTN_DEFROST_GLASS
  type: OUTPUT
  description: 'Кнопка: воздух на стекло'
- net_label: BTN_FACE
  type: OUTPUT
  description: 'Кнопка: воздух в лицо'
- net_label: BTN_FEET
  type: OUTPUT
  description: 'Кнопка: воздух в ноги'
- net_label: BTN_DRY_GLASS
  type: OUTPUT
  description: 'Кнопка: сушка стекла'
- net_label: BTN_AC
  type: OUTPUT
  description: 'Кнопка: кондиционер'
- net_label: BTN_RECIRC
  type: OUTPUT
  description: 'Кнопка: рециркуляция'
- net_label: LED_DEFROST_GLASS_DRV
  type: INPUT
  description: 'Индикатор кнопки: воздух на стекло (активный низкий уровень)'
- net_label: LED_FACE_DRV
  type: INPUT
  description: 'Индикатор кнопки: воздух в лицо (активный низкий уровень)'
- net_label: LED_FEET_DRV
  type: INPUT
  description: 'Индикатор кнопки: воздух в ноги (активный низкий уровень)'
- net_label: LED_DRY_GLASS_DRV
  type: INPUT
  description: 'Индикатор кнопки: сушка стекла (активный низкий уровень)'
- net_label: LED_AC_DRV
  type: INPUT
  description: 'Индикатор кнопки: кондиционер (активный низкий уровень)'
- net_label: LED_RECIRC_DRV
  type: INPUT
  description: 'Индикатор кнопки: рециркуляция (активный низкий уровень)'
- net_label: TEMP_SET_ADC
  type: OUTPUT
  description: АЦП задания температуры (внешний потенциометр, 2-проводное включение)
- net_label: FAN_SEL_ADC
  type: OUTPUT
  description: АЦП скорости вентилятора (кодировка резисторами R_SEL_1..4 на плате)
- net_label: GALLET_POS_1
  type: INPUT
  description: |
    Контакт галлетника — позиция 1 скорости.
    При замыкании на GALLET_COM/общий провод замыкает R_SEL_1
    на GND. В остальных положениях — разомкнут.
- net_label: GALLET_POS_2
  type: INPUT
  description: 'Контакт галлетника — позиция 2 скорости'
- net_label: GALLET_POS_3
  type: INPUT
  description: 'Контакт галлетника — позиция 3 скорости'
- net_label: GALLET_POS_4
  type: INPUT
  description: 'Контакт галлетника — позиция 4 скорости'
- net_label: NTC_CABIN
  type: INPUT
  description: Температура воздуха в салоне (NTC на плате в трубе продувки)
- net_label: ILLUM_IN_RAW
  type: POWER
  description: |
    Аналоговое питание подсветки прибора с выхода внешнего
    регулятора яркости (диммера), J1:22. Диапазон 1..14,4В.
    На этом листе используется только для детектора габаритов
    через делитель R39/R40.
- net_label: ILLUM_SENSE
  type: OUTPUT
  description: Сигнал подсветки после делителя на вход АЦП МК

