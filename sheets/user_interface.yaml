    type: TYPE_C_100NF
    description: "Фильтр АЦП задания температуры"
  C23:
    type: TYPE_C_100NF
    description: "Фильтр АЦП скорости вентилятора"
  C24:
    type: TYPE_C_100NF
    description: "Фильтр АЦП температуры салона"
