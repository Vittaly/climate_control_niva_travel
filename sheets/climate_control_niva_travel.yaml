root_page:
  project: Climate Control Niva Travel
  version: '2.8'
  file: climate_control_niva_travel.kicad_sch

  # ─────────────────────────────────────────────────────────────────
  # Модель идентификации листов
  #
  #   * Первоисточник — sheets/<stem>.yaml. Stem = имя файла без .yaml.
  #   * Схема листа   — <stem>.kicad_sch. Имя выводится из stem'а,
  #                     отдельным полем нигде не дублируется.
  #   * Ключ компонента в components ниже — X_<STEM_UPPER> для
  #     одиночного листа и X_<STEM_UPPER>_<INST> для мульти-инстанса.
  #   * Единственное место, где указывается связь с .kicad_sch —
  #     атрибут value_sch у соответствующего X_*. Никакие page_name,
  #     file, value внутри sheets/*.yaml больше не читаются.
  #   * Список листов к прогону не хранится: он выводится как
  #     {X_*, встречающиеся в nets} ∪ standalone_sheets.
  #   * standalone_sheets — только stem'ы; листы без X_* и без
  #     подключения к иерархии (силовой модуль, тестовые стенды).
  #
  # Корневая страница — тоже лист. Модели её компонентов объявлены
  # в component_types[type].spice, как и на любом другом листе.
  # Модель МК (STM32G071RBT6) — статический subckt в
  # spice/lib/mcu_emulator.lib; поведение пинов задаётся
  # сценариями через scenarios[*].params.U1.
  #
  # Разъём J1 к автомобилю (2×16) вынесен на эту страницу.
  # Питающие цепи (защита от переполюсовки, стабилизаторы,
  # фильтры, TVS) остаются на листе power_supply и связаны с J1
  # через порты VBAT_IN (вход) и V5_SENS (выход).
  #
  # Путь к .lib — общая конвенция скриптов (spice/lib), в YAML не
  # дублируется.
  #
  # Соглашения:
  #   * Идентификаторы типов (TYPE_*) — только ASCII: A-Z, a-z, 0-9, _.
  #     Кириллица, пробелы, спецсимволы в именах типов не используются.
  #   * value в типе — KiCad-нотация для R/C/L (10k, 1u, 100n) или
  #     осмысленный текст для компонентов с spice-секцией (там value
  #     SPICE-значения задаётся через spice.value).
  # ─────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────
  # Модель связей листов (порты)
  #
  # Порт листа — это сеть ВНУТРИ листа с флагом is_hierarchical_port:
  # true. Имя порта = имя сети. Направление (для размещения на левом
  # или правом краю bbox листа на родителе) задаётся полем
  # port_direction: OUTPUT; по умолчанию — INPUT. Оба поля
  # объявляются в sheets/<stem>.yaml.
  #
  # На родительской странице порт используется как узел обычной
  # сети, через pinfunction: <имя_порта>. Связь «порт ребёнка ↔
  # корневая сеть» выводится по имени: pinfunction у sheet-узла
  # ссылается на сеть-порт ребёнка. Ни port_map, ни верхний блок
  # ports: в YAML больше не используются.
  #
  # Порты корневой страницы нужны, когда корень включается как
  # вложенный лист (X_DUT в climate_control_testbench.yaml): тогда
  # каждый порт превращается в пин sheet-символа на родителе.
  #
  # pin: — ТОЛЬКО числовой номер вывода KiCad ('1', '29', '64').
  # pinfunction: — функциональное имя (VBAT, PA13, OUT1, MOTOR_A, ...).
  # Резолв имён выполняет Component.pin_by_name() с нормализацией
  # суффиксов (VSS/VSSA → VSS, PA14-BOOT0 → PA14 и т.п.).
  #
  # У sheet-компонента пины не имеют числовых номеров, поэтому
  # ссылки на них — только через pinfunction.
  # ─────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────
  # Модель данных о пинах МК
  #
  # Источник истины о том, какие пины U1 используются и как —
  # секция `nets`. Отдельного `mcu_pin_map` больше нет.
  #
  # Узел U1 в nets описывается полями:
  #   pinfunction — имя вывода из символа KiCad ('PA13', 'VBAT', ...).
  #   function    — короткая машинно-читаемая роль ('power_in',
  #                 'SWDIO', 'reset', 'TIM1_CH1'). Опционально.
  #   description — человекочитаемое описание логики использования.
  #                 Не используется pipeline'ом.
  # ─────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────
  # Листы без X_* — не входят в иерархию основного проекта.
  #
  # Для них нет (sheet ...) в корневой схеме и нет ссылок из nets.
  # Генерируются как отдельные .kicad_sch по своему <stem>.yaml и
  # гоняются в e2e наравне с иерархическими листами.
  #
  # climate_control_testbench — сквозной тестовый стенд: поднимает
  # основную схему как вложенный X_DUT и обвязывает её внешним
  # миром (моторы заслонок, потенциометры ОС, NTC, CAN-терминатор).
  # ─────────────────────────────────────────────────────────────────
  standalone_sheets:
    - fan_driver_testbench

  j1_pinout:
    '1': +12В_БАТ вход питания
    '2': +12В_БАТ вход питания (дубль, снижение нагрузки)
    '3': GND_PWR
    '4': GND_PWR (дубль)
    '5': M1_A
    '6': M1_B
    '7': M1_FB (выход потенциометра ОС)
    '8': M2_A
    '9': M2_B
    '10': M2_FB
    '11': M3_A
    '12': M3_B
    '13': M3_FB
    '14': M4_A
    '15': M4_B
    '16': M4_FB
    '17': +5В_SENS/REF (края потенциометров заслонок и питание датчиков)
    '18': DGND (общая цифровая земля датчиков/потенциометров)
    '19': NTC_HEAT (датчик на патрубке радиатора печки)
    '20': SOLAR_IN (0..5В, вход от внешнего датчика солнечной радиации)
    '21': COND_IN (0..5В, вход от внешнего датчика конденсата на стекле)
    '22': ILLUM_IN (подсветка прибора)
    '23': FAN_PWM_OUT (ШИМ на внешний силовой модуль)
    '24': AC_REQ_OUT (+12В запрос кондиционера на вход ЭБУ)
    '25': CANH
    '26': CANL
    '27': резерв
    '28': резерв
    '29': резерв
    '30': резерв
    '31': резерв
    '32': резерв

  symbol_pin_map: {}

  component_types:
    # R/C/L — примитивы, spice-секции не требуют
    # (кроме случаев, где value не в KiCad-нотации — тогда
    # задаётся spice.value).
    # Connector не моделируется.
    # STM32G071RBT6 несёт spice-секцию с 64 явными узлами
    # (Position 1..64 из XML STM32G071R(6-8-B)Tx.xml) и ссылкой
    # на статический subckt в spice/lib/mcu_emulator.lib.
    # Поведение пинов задаётся сценариями (params.U1), а не
    # генерируется per-scenario.

    TYPE_C_100NF:
      symbol: Device:C
      footprint: Capacitor_SMD:C_0603_1608Metric
      value: 100nF
      fields:
        Type: Ceramic
        Dielectric: X7R

    TYPE_C_10UF_6.3V:
      symbol: Device:C
      footprint: Capacitor_SMD:C_0805_2012Metric
      value: 10uF
      fields:
        Voltage: 6.3V
        Type: Ceramic
        Dielectric: X7R

    TYPE_L_FERRITE_600R_VDDA:
      symbol: Device:L
      footprint: Inductor_SMD:L_0805_2012Metric
      value: Ferrite 600R@100MHz VDDA
      fields: {}
      spice:
        description: |
          Ферритовый дроссель 600Ω@100MHz по питанию VDDA (FB1).
          Эквивалентная индуктивность ≈ 1 мкГн в рабочей полосе
          0.1–30 МГц. Реальный компонент — Murata BLM21BB601SN1
          или аналог. Isat с запасом покрывает ток АЦП (единицы мА).
        value: 1u

    TYPE_CONN01X04_SWD_DEBUG:
      symbol: Connector_Generic:Conn_01x04
      footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
      value: SWD debug 1x04
      fields: {}

    TYPE_CONN_02X16:
      symbol: Connector_Generic:Conn_02x16_Odd_Even
      footprint: Connector_PinHeader_2.54mm:PinHeader_2x16_P2.54mm_Horizontal
      value: Разъём к автомобилю 2x16 (32 конт.)
      fields: {}

    TYPE_R_10K:
      symbol: Device:R
      footprint: Resistor_SMD:R_0603_1608Metric
      value: 10k
      fields:
        Power: 0.1W
        Tolerance: 1%

    TYPE_STM32G071RBT6:
      lcsc_id: C432213
      value: STM32G071RBT6
      footprint: Package_QFP:LQFP-64_10x10mm_P0.5mm
      fields: {}
      spice:
        description: |
          Электрическая модель STM32G071RBT6 для симуляции
          периферийного поведения пинов.

          Живёт в spice/lib/mcu_emulator.lib в виде двух subckt:
            MCU_PIN        — поведение одного пина (примитив),
            STM32G071RBT6  — обёртка: 64 позиционных узла,
                             60 инстансов MCU_PIN (по одному на GPIO).

          Модель НЕ знает про периферию (ADC/TIM/USART/DAC).
          Описывает только вольт-амперное поведение пина.
          Режим задаётся параметром MODE:
            0  HiZ          симметричный делитель 1G/1G VDD↔VSS
            1  ADC          10 МОм || 5 пФ на GND
            2  вход pull-up 40 кОм к VDD
            3  вход pull-dn 40 кОм к GND
            4  выход high   VOH через ROUT=40 Ом
            5  выход low    VOL через ROUT=40 Ом
            6  PWM          VLO..VHI, FREQ, DUTY, через ROUT
            ≠0..6           отрава: 999 В на пине.

          Значения по умолчанию (все 60 GPIO в HiZ) заданы в PARAMS:
          subckt STM32G071RBT6 внутри .lib. Сценарий перекрывает
          только те пины, которые реально используются, через
          scenarios[*].params.U1:
            PA9:  out_high
            PA10: out_low
            PA8:  { mode: pwm, freq: 25k, duty: 0.5 }
          Генератор разворачивает человекочитаемые алиасы в числа
          и дописывает MODE_*=/FREQ_*=/DUTY_*=… в X-строку.

          Power-пины (Position 6 VBAT, 7 VREF+, 8 VDD, 9 VSS) —
          формальные узлы subckt без MCU_PIN. Используются как
          vcc/gnd для 60 инстансов MCU_PIN, снаружи подключаются
          к реальным шинам (VCC_3V3, GND, VDDA_3V3).

          Порядок узлов subckt = Position 1..64 из XML
          STM32G071R(6-8-B)Tx.xml. Менять нельзя: любая правка
          порядка = неверная привязка пинов в XU1.
        include: mcu_emulator.lib
        subckt: STM32G071RBT6
        nodes:
          # Порядок = Position 1..64. Число справа = номер пина
          # в KiCad-символе (совпадает с физическим выводом LQFP-64).
          PC11:  { pin: "1"  }
          PC12:  { pin: "2"  }
          PC13:  { pin: "3"  }
          PC14:  { pin: "4"  }
          PC15:  { pin: "5"  }
          VBAT:  { pin: "6"  }
          VREF:  { pin: "7"  }
          VDD:   { pin: "8"  }
          VSS:   { pin: "9"  }
          PF0:   { pin: "10" }
          PF1:   { pin: "11" }
          PF2:   { pin: "12" }
          PC0:   { pin: "13" }
          PC1:   { pin: "14" }
          PC2:   { pin: "15" }
          PC3:   { pin: "16" }
          PA0:   { pin: "17" }
          PA1:   { pin: "18" }
          PA2:   { pin: "19" }
          PA3:   { pin: "20" }
          PA4:   { pin: "21" }
          PA5:   { pin: "22" }
          PA6:   { pin: "23" }
          PA7:   { pin: "24" }
          PC4:   { pin: "25" }
          PC5:   { pin: "26" }
          PB0:   { pin: "27" }
          PB1:   { pin: "28" }
          PB2:   { pin: "29" }
          PB10:  { pin: "30" }
          PB11:  { pin: "31" }
          PB12:  { pin: "32" }
          PB13:  { pin: "33" }
          PB14:  { pin: "34" }
          PB15:  { pin: "35" }
          PA8:   { pin: "36" }
          PA9:   { pin: "37" }
          PC6:   { pin: "38" }
          PC7:   { pin: "39" }
          PD8:   { pin: "40" }
          PD9:   { pin: "41" }
          PA10:  { pin: "42" }
          PA11:  { pin: "43" }
          PA12:  { pin: "44" }
          PA13:  { pin: "45" }
          PA14:  { pin: "46" }
          PA15:  { pin: "47" }
          PC8:   { pin: "48" }
          PC9:   { pin: "49" }
          PD0:   { pin: "50" }
          PD1:   { pin: "51" }
          PD2:   { pin: "52" }
          PD3:   { pin: "53" }
          PD4:   { pin: "54" }
          PD5:   { pin: "55" }
          PD6:   { pin: "56" }
          PB3:   { pin: "57" }
          PB4:   { pin: "58" }
          PB5:   { pin: "59" }
          PB6:   { pin: "60" }
          PB7:   { pin: "61" }
          PB8:   { pin: "62" }
          PB9:   { pin: "63" }
          PC10:  { pin: "64" }

  components:
    C10:
      type: TYPE_C_100NF
      description: фильтр VDDA
    C21:
      type: TYPE_C_100NF
      description: сброс МК
    C5:
      type: TYPE_C_10UF_6.3V
      description: выход стабилизатора 3,3В
    C6:
      type: TYPE_C_10UF_6.3V
      description: шина 3,3В (общий накопитель)
    C7:
      type: TYPE_C_100NF
      description: развязка VDD_1
    C8:
      type: TYPE_C_100NF
      description: развязка VDD_2
    C9:
      type: TYPE_C_100NF
      description: развязка VDD_3
    FB1:
      type: TYPE_L_FERRITE_600R_VDDA
      description: Феррит 600Ω@100MHz по питанию VDDA
    J1:
      type: TYPE_CONN_02X16
      description: "Разъём к автомобилю 2x16 (32 конт.)"
    J2:
      type: TYPE_CONN01X04_SWD_DEBUG
      description: SWD-отладка 1x04
    R1:
      type: TYPE_R_10K
      description: сброс МК
    R2:
      type: TYPE_R_10K
      description: pull-down 10k на SWCLK/BOOT0
    U1:
      type: TYPE_STM32G071RBT6
      description: LQFP-64

    # ─── Иерархические листы основного проекта ─────────────────────
    # Ключ X_<STEM_UPPER> — производное от stem'а YAML-файла листа.
    # value_sch — единственное место, где указан .kicad_sch листа.
    #
    # Порты листа не описываются здесь: они берутся из дочернего
    # YAML (nets.*.is_hierarchical_port). Связь с корневыми сетями —
    # через nets этой страницы, узел {component: X_*, pinfunction: <порт>}.

    X_POWER_SUPPLY:
      symbol: Core:Hierarchical_Sheet
      description: Модуль PWR
      value_sch: power_supply.kicad_sch

    X_USER_INTERFACE:
      symbol: Core:Hierarchical_Sheet
      description: Модуль UI
      value_sch: user_interface.kicad_sch

    X_HEATING_SENSOR:
      symbol: Core:Hierarchical_Sheet
      description: Модуль SEN_HEAT
      value_sch: heating_sensor.kicad_sch

    X_SOLAR_SENSOR:
      symbol: Core:Hierarchical_Sheet
      description: Модуль SEN_SOLAR
      value_sch: solar_sensor.kicad_sch

    X_CONDENSATE_SENSOR:
      symbol: Core:Hierarchical_Sheet
      description: Модуль SEN_COND
      value_sch: condensate_sensor.kicad_sch

    X_POWER_OUTPUTS:
      symbol: Core:Hierarchical_Sheet
      description: Модуль OUT
      value_sch: power_outputs.kicad_sch

    X_CAN_BUS:
      symbol: Core:Hierarchical_Sheet
      description: Модуль CAN
      value_sch: can_bus.kicad_sch

    X_CABIN_SENSOR:
      symbol: Core:Hierarchical_Sheet
      description: Модуль SEN_CABIN
      value_sch: cabin_sensor.kicad_sch

    X_BACKLIGHT:
      symbol: Core:Hierarchical_Sheet
      description: Модуль радиальной фоновой подсветки шкал ручек управления
      value_sch: backlight.kicad_sch

    # ─── 4 экземпляра универсального канала заслонки ───────────────
    # Один и тот же actuator_channel.kicad_sch инстанцируется 4 раза.
    # Суффикс _M1.._M4 различает инстансы; конкретные цепи задаются
    # в nets этой страницы: узел {component: X_ACTUATOR_CHANNEL_M*, pinfunction: <порт>}
    # подключается к корневой сети. Внутри листа имена портов
    # обобщённые: IN1, IN2, MOTOR_A, MOTOR_B, FB_RAW, FB.
    X_ACTUATOR_CHANNEL_M1:
      symbol: Core:Hierarchical_Sheet
      description: "Канал заслонки 1 (ТЕПЛО/ХОЛОД)"
      value_sch: actuator_channel.kicad_sch
    X_ACTUATOR_CHANNEL_M2:
      symbol: Core:Hierarchical_Sheet
      description: "Канал заслонки 2 (СТЕКЛО или ЛИЦО+НОГИ)"
      value_sch: actuator_channel.kicad_sch
    X_ACTUATOR_CHANNEL_M3:
      symbol: Core:Hierarchical_Sheet
      description: "Канал заслонки 3 (ЛИЦО или НОГИ)"
      value_sch: actuator_channel.kicad_sch
    X_ACTUATOR_CHANNEL_M4:
      symbol: Core:Hierarchical_Sheet
      description: "Канал заслонки 4 (РЕЦИРКУЛЯЦИЯ)"
      value_sch: actuator_channel.kicad_sch

  nets:
    # ─────────────────────────────────────────────────────────────────
    # Порты корневой страницы
    #
    # Сети ниже несут флаг is_hierarchical_port: true. Это значит:
    #   * они объявлены как порты корневого листа;
    #   * когда корень включён как вложенный лист (X_DUT в
    #     climate_control_testbench.yaml), у sheet-символа X_DUT
    #     появляется пин с именем этой сети;
    #   * port_direction задаёт сторону пина на bbox листа:
    #       INPUT  — левый край (внешний сигнал входит в DUT),
    #       OUTPUT — правый край (DUT выдаёт сигнал наружу).
    #
    # Набор портов = распиновка J1 (разъём к автомобилю). Всё
    # остальное (VCC_12V, VCC_5V, VCC_3V3, VDDA_3V3, M1_IN1..M4_IN2,
    # FB_M1..FB_M4, SWDIO/SWCLK/NRST, CAN_TX/RX и т.п.) — внутренние
    # связи и портами не объявляются.
    # ─────────────────────────────────────────────────────────────────

    # ─── Питающие шины ─────────────────────────────────────────────
    # J1 подключается к VBAT_IN (пины 1,2) и V5_SENS (пин 17);
    # защита, фильтры и стабилизаторы живут на листе power_supply,
    # с которым эти две сети связаны через порты.

    VBAT_IN:
      name: VBAT_IN
      description: Входное бортовое питание +12В, J1:1,2. Порт корневой страницы (INPUT).
      is_hierarchical_port: true
      port_direction: INPUT
      attributes:
        type: POWER
        voltage_level: 12.0V
        current_max: 15A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: J1
        pin: '1'
      - component: J1
        pin: '2'
      - component: X_POWER_SUPPLY
        pinfunction: VBAT_IN

    VCC_12V:
      name: VCC_12V
      description: Силовая шина +12В после фильтра помех L1, с TVS D2 и конденсаторами
      attributes:
        type: POWER
        voltage_level: 12.0V
        current_max: 15A
        spice_simulation:
          model_stimulus: DC 12.0
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: X_POWER_SUPPLY
        pinfunction: VCC_12V
      - component: X_CABIN_SENSOR
        pinfunction: VCC_12V
      - component: X_POWER_OUTPUTS
        pinfunction: VCC_12V
      - component: X_ACTUATOR_CHANNEL_M1
        pinfunction: VCC_12V
      - component: X_ACTUATOR_CHANNEL_M2
        pinfunction: VCC_12V
      - component: X_ACTUATOR_CHANNEL_M3
        pinfunction: VCC_12V
      - component: X_ACTUATOR_CHANNEL_M4
        pinfunction: VCC_12V

    VCC_5V:
      name: VCC_5V
      description: Внутреннее стабилизированное питание +5В (логика/питание стабилизатора
        3,3В)
      attributes:
        type: POWER
        voltage_level: 5.0V
        current_max: 0.5A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: X_CAN_BUS
        pinfunction: VCC_5V
      - component: X_POWER_SUPPLY
        pinfunction: VCC_5V

    V5_SENS:
      name: V5_SENS
      description: |
        Питание датчиков и краёв потенциометров ОС (J1:17).
        Порт на лист power_supply (OUTPUT): на этом листе
        стоит TVS D5 и диодная развязка D4 от внутреннего +5В.
        Также порт корневой страницы (OUTPUT) — при включении
        корня как X_DUT во внешний стенд эта шина идёт наружу.
      is_hierarchical_port: true
      port_direction: OUTPUT
      attributes:
        type: POWER
        voltage_level: 5.0V
        current_max: 0.1A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: J1
        pin: '17'
      - component: X_POWER_SUPPLY
        pinfunction: V5_SENS

    VCC_3V3:
      name: VCC_3V3
      description: Логическое питание +3,3В микроконтроллера и фронт-панели
      attributes:
        type: POWER
        voltage_level: 3.3V
        current_max: 0.3A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: C5
        pin: '1'
      - component: C6
        pin: '1'
      - component: C7
        pin: '1'
      - component: C8
        pin: '1'
      - component: C9
        pin: '1'
      - component: U1
        pinfunction: VBAT
        function: power_in
        description: |
          Резервное питание RTC/backup-домена. Внешней батареи нет,
          поэтому соединён с VDD (VCC_3V3). Керамический конденсатор
          100 нФ на GND распаян рядом с пином.
      - component: U1
        pinfunction: VDD
        function: power_in
        description: |
          Основное питание цифрового ядра и GPIO. Развязка: C7, C8, C9
          (100 нФ) и C6 (10 мкФ).
      - component: FB1
        pin: '1'
      - component: R1
        pin: '1'
      - component: J2
        pin: '1'
      - component: X_POWER_SUPPLY
        pinfunction: VCC_3V3
      - component: X_USER_INTERFACE
        pinfunction: VCC_3V3
      - component: X_HEATING_SENSOR
        pinfunction: VCC_3V3

    VDDA_3V3:
      name: VDDA_3V3
      description: Аналоговое питание АЦП (через феррит FB1 от VCC_3V3)
      attributes:
        type: POWER
        voltage_level: 3.3V
        current_max: 0.3A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: FB1
        pin: '2'
      - component: C10
        pin: '1'
      - component: U1
        pinfunction: VREF+
        function: power_in
        description: |
          Опорное напряжение АЦП. Питается через феррит FB1
          (600Ω @ 100 МГц) от VCC_3V3, чтобы отфильтровать импульсные
          помехи от цифровой части. C10 (100 нФ) — на выходе FB1.

    GND:
      name: GND
      description: |
        Общий провод (кузов автомобиля). Порт корневой страницы
        (INPUT) — при включении корня как X_DUT во внешний стенд
        соединяется с общей шиной стенда.
      is_hierarchical_port: true
      port_direction: INPUT
      attributes:
        type: GND
        voltage_level: 0V
        current_max: 15A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: C5
        pin: '2'
      - component: C6
        pin: '2'
      - component: C7
        pin: '2'
      - component: C8
        pin: '2'
      - component: C9
        pin: '2'
      - component: C10
        pin: '2'
      - component: C21
        pin: '2'
      - component: R2
        pin: '2'
      - component: J1
        pin: '3'
      - component: J1
        pin: '4'
      - component: J1
        pin: '18'
      - component: J2
        pin: '4'
      - component: U1
        pinfunction: VSS
        function: power_in
        description: |
          Общая земля. В LQFP-64 единственный вывод VSS (VSSA и VSS
          объединены внутри чипа). Подключать к сплошному полигону
          земли через переходные отверстия у пина.
      - component: X_CAN_BUS
        pinfunction: GND
      - component: X_POWER_SUPPLY
        pinfunction: GND
      - component: X_USER_INTERFACE
        pinfunction: GND
      - component: X_CABIN_SENSOR
        pinfunction: GND
      - component: X_HEATING_SENSOR
        pinfunction: GND
      - component: X_SOLAR_SENSOR
        pinfunction: GND
      - component: X_CONDENSATE_SENSOR
        pinfunction: GND
      - component: X_POWER_OUTPUTS
        pinfunction: GND
      - component: X_ACTUATOR_CHANNEL_M1
        pinfunction: GND
      - component: X_ACTUATOR_CHANNEL_M2
        pinfunction: GND
      - component: X_ACTUATOR_CHANNEL_M3
        pinfunction: GND
      - component: X_ACTUATOR_CHANNEL_M4
        pinfunction: GND
      - component: X_BACKLIGHT
        pinfunction: GND

    NRST:
      name: NRST
      description: Сброс МК (RC-цепь)
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: U1
        pinfunction: PF2
        function: reset
        description: |
          Активный низкий уровень сброса. RC-цепь: R1 (10 кОм) —
          подтяжка к VCC_3V3, C21 (100 нФ) — на GND. Внешний
          сброс — через SWD-разъём J2.
      - component: R1
        pin: '2'
      - component: C21
        pin: '1'

    SWDIO:
      name: SWDIO
      description: 'Отладочный интерфейс SWD: данные'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: J2
        pin: '2'
      - component: U1
        pinfunction: PA13
        function: SWDIO
        description: |
          Данные SWD. Встроенная подтяжка ~40 кОм к VDD активна
          после reset, внешняя не требуется. Разъём J2.2.

    SWCLK:
      name: SWCLK
      description: 'Отладочный интерфейс SWD: тактирование (совмещено с BOOT0)'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: J2
        pin: '3'
      - component: U1
        pinfunction: PA14
        function: SWCLK
        description: |
          Тактирование SWD, совмещено с BOOT0 (отдельного пина BOOT0
          у G071 нет). При включении уровень на PA14 выбирает режим
          загрузки: низкий — Flash, высокий — системный загрузчик.
          Подтяжка R2 (10 кОм) к GND гарантирует загрузку из Flash
          без участия программатора.
      - component: R2
        pin: '1'
        description: pull-down BOOT0/SWCLK к GND

    BTN_DEFROST_GLASS:
      name: BTN_DEFROST_GLASS
      description: 'Кнопка: воздух на стекло'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: U1
        pinfunction: PB10
        description: |
          Вход кнопки «воздух на стекло». Внутренняя pull-up не
          используется: подтяжка выполняется на листе UI к VCC_3V3,
          активный уровень — низкий (кнопка замыкает на GND).
      - component: X_USER_INTERFACE
        pinfunction: BTN_DEFROST_GLASS

    BTN_FACE:
      name: BTN_FACE
      description: 'Кнопка: воздух в лицо'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: U1
        pinfunction: PB11
        description: 'Вход кнопки «воздух в лицо», активный низкий, подтяжка на UI.'
      - component: X_USER_INTERFACE
        pinfunction: BTN_FACE

    BTN_FEET:
      name: BTN_FEET
      description: 'Кнопка: воздух в ноги'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: U1
        pinfunction: PB12
        description: 'Вход кнопки «воздух в ноги», активный низкий, подтяжка на UI.'
      - component: X_USER_INTERFACE
        pinfunction: BTN_FEET

    BTN_DRY_GLASS:
      name: BTN_DRY_GLASS
      description: 'Кнопка: сушка стекла'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: U1
        pinfunction: PB13
        description: 'Вход кнопки «сушка стекла», активный низкий, подтяжка на UI.'
      - component: X_USER_INTERFACE
        pinfunction: BTN_DRY_GLASS

    BTN_AC:
      name: BTN_AC
      description: 'Кнопка: кондиционер'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: U1
        pinfunction: PB14
        description: 'Вход кнопки «кондиционер», активный низкий, подтяжка на UI.'
      - component: X_USER_INTERFACE
        pinfunction: BTN_AC

    BTN_RECIRC:
      name: BTN_RECIRC
      description: 'Кнопка: рециркуляция'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: U1
        pinfunction: PB15
        description: 'Вход кнопки «рециркуляция», активный низкий, подтяжка на UI.'
      - component: X_USER_INTERFACE
        pinfunction: BTN_RECIRC

    LED_DEFROST_GLASS_DRV:
      name: LED_DEFROST_GLASS_DRV
      description: 'Индикатор кнопки: воздух на стекло (управление, активный низкий
        уровень)'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: X_USER_INTERFACE
        pinfunction: LED_DEFROST_GLASS_DRV
      - component: U1
        pinfunction: PA15
        description: |
          Управление светодиодом индикатора. Активный низкий
          (0 = LED горит). Ток ограничивается резистором на листе UI.

    LED_FACE_DRV:
      name: LED_FACE_DRV
      description: 'Индикатор кнопки: воздух в лицо (управление, активный низкий уровень)'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: X_USER_INTERFACE
        pinfunction: LED_FACE_DRV
      - component: U1
        pinfunction: PB3
        description: 'Управление LED «в лицо», активный низкий.'

    LED_FEET_DRV:
      name: LED_FEET_DRV
      description: 'Индикатор кнопки: воздух в ноги (управление, активный низкий уровень)'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: X_USER_INTERFACE
        pinfunction: LED_FEET_DRV
      - component: U1
        pinfunction: PB4
        description: 'Управление LED «в ноги», активный низкий.'

    LED_DRY_GLASS_DRV:
      name: LED_DRY_GLASS_DRV
      description: 'Индикатор кнопки: сушка стекла (управление, активный низкий уровень)'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: X_USER_INTERFACE
        pinfunction: LED_DRY_GLASS_DRV
      - component: U1
        pinfunction: PC14
        description: |
          Управление LED «сушка стекла», активный низкий.
          Пин совмещён с OSC32_IN (LSE). Так как RTC использует
          внутренний LSI, линия свободна под GPIO.

    LED_AC_DRV:
      name: LED_AC_DRV
      description: 'Индикатор кнопки: кондиционер (управление, активный низкий уровень)'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: X_USER_INTERFACE
        pinfunction: LED_AC_DRV
      - component: U1
        pinfunction: PC15
        description: |
          Управление LED «кондиционер», активный низкий.
          Пин совмещён с OSC32_OUT (LSE). Свободен под GPIO
          (RTC на внутреннем LSI).

    LED_RECIRC_DRV:
      name: LED_RECIRC_DRV
      description: 'Индикатор кнопки: рециркуляция (управление, активный низкий уровень)'
      attributes:
        type: DIGITAL_SIGNAL
        voltage_level: 3.3V
        current_max: 0.02A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: X_USER_INTERFACE
        pinfunction: LED_RECIRC_DRV
      - component: U1
        pinfunction: PC2
        description: 'Управление LED «рециркуляция», активный низкий.'

    TEMP_SET_ADC:
      name: TEMP_SET_ADC
      description: АЦП задания температуры (потенциометр, 2-проводное включение, внутренний
        коннектор J_POT)
      attributes:
        type: ANALOG_SIGNAL
        voltage_level: 0..3.3V
        current_max: 0.005A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: U1
        pinfunction: PA0
        description: |
          АЦП задания температуры. Потенциометр подключён между
          VCC_3V3 и GND (2-проводное включение), движок — на этот пин.
          ADC1_IN0.
      - component: X_USER_INTERFACE
        pinfunction: TEMP_SET_ADC

    FAN_SEL_ADC:
      name: FAN_SEL_ADC
      description: АЦП выбора режима/скорости вентилятора (галлетник AUTO,0..4, резисторный
        код)
      attributes:
        type: ANALOG_SIGNAL
        voltage_level: 0..3.3V
        current_max: 0.005A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: U1
        pinfunction: PA1
        description: |
          АЦП положения галлетника скорости вентилятора. Резисторный
          делитель, задающий уровни для AUTO и 0..4. ADC1_IN1.
      - component: X_USER_INTERFACE
        pinfunction: FAN_SEL_ADC

    NTC_CABIN:
      name: NTC_CABIN
      description: Температура воздуха в салоне (NTC на плате в трубе продувки)
      attributes:
        type: ANALOG_SIGNAL
        voltage_level: 0..3.3V
        current_max: 0.005A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: U1
        pinfunction: PA2
        description: |
          Сигнал NTC-датчика температуры салона. Делитель
          NTC + подтяжка на листе SEN_CABIN. ADC1_IN2.
      - component: X_USER_INTERFACE
        pinfunction: NTC_CABIN
      - component: X_CABIN_SENSOR
        pinfunction: NTC_CABIN

    NTC_HEAT_W:
      name: NTC_HEAT_W
      description: |
        Датчик патрубка отопителя: узел линии на разъёме J1:19.
        Порт корневой страницы (INPUT) — датчик внешний.
      is_hierarchical_port: true
      port_direction: INPUT
      attributes:
        type: ANALOG_SIGNAL
        voltage_level: 0..3.3V
        current_max: 0.005A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: J1
        pin: '19'
      - component: X_HEATING_SENSOR
        pinfunction: NTC_HEAT_W

    NTC_HEAT:
      name: NTC_HEAT
      description: 'Датчик патрубка отопителя: сигнал на АЦП (после защитного резистора)'
      attributes:
        type: ANALOG_SIGNAL
        voltage_level: 0..3.3V
        current_max: 0.005A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: X_HEATING_SENSOR
        pinfunction: NTC_HEAT
      - component: U1
        pinfunction: PA3
        description: |
          Сигнал NTC-датчика температуры патрубка печки. Делитель
          на листе SEN_HEAT. ADC1_IN3.

    SOLAR_IN_RAW:
      name: SOLAR_IN_RAW
      description: |
        Вход датчика солнечной радиации (0..5В), J1:20.
        Порт корневой страницы (INPUT).
      is_hierarchical_port: true
      port_direction: INPUT
      attributes:
        type: ANALOG_SIGNAL
        voltage_level: 0..5.0V
        current_max: 0.005A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: J1
        pin: '20'
      - component: X_SOLAR_SENSOR
        pinfunction: SOLAR_IN_RAW

    SOLAR_ADC:
      name: SOLAR_ADC
      description: Сигнал солнечной радиации после делителя 5В->3,3В на АЦП
      attributes:
        type: ANALOG_SIGNAL
        voltage_level: 0..3.3V
        current_max: 0.005A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: U1
        pinfunction: PA4
        description: |
          Солнечная радиация после делителя 5В→3,3В (на листе
          SEN_SOLAR). ADC1_IN4.
      - component: X_SOLAR_SENSOR
        pinfunction: SOLAR_ADC

    COND_IN_RAW:
      name: COND_IN_RAW
      description: |
        Вход датчика конденсата на стекле (0..5В), J1:21.
        Порт корневой страницы (INPUT).
      is_hierarchical_port: true
      port_direction: INPUT
      attributes:
        type: ANALOG_SIGNAL
        voltage_level: 0..5.0V
        current_max: 0.005A
        spice_simulation:
          model_stimulus: ''
          parasitic_r_ohm: 0.05
          parasitic_l_h: 10n
      nodes:
      - component: J1
        pin: '21'
      - component: X_CONDENSATE_SENSOR
        pinfunction: COND_IN_RAW

