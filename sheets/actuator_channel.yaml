functional_purpose: |
  Универсальный канал управления моторедуктором заслонки климатической
  системы. Содержит H-мост DRV8871, развязку по питанию и делитель ОС
  потенциометра положения.

  Переиспользуется 4 раза на корневой странице проекта — по одному
  экземпляру на каждую заслонку (X_M1..X_M4 в main.yaml). Конкретные
  имена цепей задаются сопоставлением портов при инстанцировании,
  внутри листа используются обобщённые имена: IN1, IN2, MOTOR_A,
  MOTOR_B, FB_RAW, FB.

  Соответствие KiCad-reference и логических ролей:
    U1 = U,     C1 = C_VM,
    R1 = R_ILIM, R2 = R_TOP, R3 = R_BOT,
    C2 = C_FB.

  В SPICE:
    * U1 (DRV8871) — модель в TYPE_DRV8871DDA.spice (subckt, include);
    * моторедуктор — testbench, подключается inline в каждом сценарии
      через motor: { include, subckt, nodes, params };
    * R/C — примитивы, spice не требуют.

  ВАЖНО: сценарии ACT_CH_FB_* проверяют только делитель ОС, но
  инстанс субсхемы Xactuator_channel поднимает весь лист целиком,
  включая DRV8871. Чтобы рабочая точка считалась, входы драйвера
  (VCC_12V, IN1, IN2) должны быть закреплены источниками, а выходы
  (MOTOR_A, MOTOR_B) — иметь путь на землю. Для этого в FB_*
  сценариях добавлены нулевые источники и tie-down резисторы.
  На измеряемый v(fb) они не влияют.

  Распиновка DRV8871DDA (KiCad Driver_Motor:DRV8871DDA):
    pin 1 = GND, pin 2 = IN2, pin 3 = IN1, pin 4 = ILIM,
    pin 5 = VM,  pin 6 = OUT1, pin 7 = PGND, pin 8 = OUT2,
    pin 9 = EP (thermal pad).
  Пины 1, 7, 9 — три разных вывода на GND, имена не уникальны,
  поэтому в nets: они адресуются по номерам (pin), а не по
  pinfunction. Остальные пины имеют уникальные имена и берутся
  по pinfunction.

ports:
  - net_label: VCC_12V
    type: POWER
    description: Силовая шина +12В после фильтра помех L1, с TVS D2 и конденсаторами
  - net_label: GND
    type: POWER
    description: Общий провод (кузов автомобиля)
  - net_label: IN1
    type: INPUT
    description: Логический вход IN1 драйвера H-моста
  - net_label: IN2
    type: INPUT
    description: Логический вход IN2 драйвера H-моста
  - net_label: MOTOR_A
    type: OUTPUT
    description: Выход A H-моста к моторедуктору заслонки
  - net_label: MOTOR_B
    type: OUTPUT
    description: Выход B H-моста к моторедуктору заслонки
  - net_label: FB_RAW
    type: INPUT
    description: Выход потенциометра положения (0..5В) с разъёма
  - net_label: FB
    type: OUTPUT
    description: Сигнал ОС после делителя 5В->3,3В на вход АЦП

component_types:
  TYPE_C_100NF:
    symbol: Device:C
    footprint: Capacitor_SMD:C_0603_1608Metric
    value: 100n
    fields:
      Type: Ceramic
      Dielectric: X7R

  TYPE_R_33K:
    symbol: Device:R
    footprint: Resistor_SMD:R_0603_1608Metric
    value: 33k
    fields:
      Power: 0.1W
      Tolerance: 1%

  TYPE_R_20K:
    symbol: Device:R
    footprint: Resistor_SMD:R_0603_1608Metric
    value: 20k
    fields:
      Power: 0.1W
      Tolerance: 1%

  TYPE_R_10K:
    symbol: Device:R
    footprint: Resistor_SMD:R_0603_1608Metric
    value: 10k
    fields:
      Power: 0.1W
      Tolerance: 1%

  TYPE_DRV8871DDA:
    symbol: Driver_Motor:DRV8871DDA
    footprint: Package_SO:Texas_HTSOP-8-1EP_3.9x4.9mm_P1.27mm_EP2.95x4.9mm_Mask2.4x3.1mm_ThermalVias
    value: DRV8871 H-мост
    fields: {}
    spice:
      description: |
        H-мост 3.6А с токоограничением и защитой, TI DRV8871.
        Моделируется: два полумоста OUT1/OUT2 с Rds_on ~0.5Ω;
        логика IN1/IN2.

        Порты subckt DRV8871: IN1 IN2 OUT1 OUT2 VM GND.
        НЕ заведены в модель пины:
          * pin 4 (ILIM) — порог токоограничения задаётся
            внешним R1, в модели фиксирован;
          * pin 7 (PGND) — подключён к GND на схеме, в модели
            неявно общий с pin 1;
          * pin 9 (EP)   — тепловой пад, в модели неявно
            на GND через pin 1.
      include: drv8871_ngspice.lib
      subckt: DRV8871
      nodes:
        IN1:  { pin: "3" }
        IN2:  { pin: "2" }
        OUT1: { pin: "6" }
        OUT2: { pin: "8" }
        VM:   { pin: "5" }
        GND:  { pin: "1" }
      required_params: []

components:
  U1:
    type: TYPE_DRV8871DDA
    description: "U: H-мост драйвера моторедуктора заслонки"
    fields: { Role: U }
  C1:
    type: TYPE_C_100NF
    description: "C_VM: развязка питания драйвера по VM"
    fields: { Role: C_VM }
  R1:
    type: TYPE_R_33K
    description: "R_ILIM: резистор установки токоограничения драйвера (подобрать)"
    fields: { Role: R_ILIM }
  R2:
    type: TYPE_R_10K
    description: "R_TOP: верхнее плечо делителя ОС потенциометра положения"
    fields: { Role: R_TOP }
  R3:
    type: TYPE_R_20K
    description: "R_BOT: нижнее плечо делителя ОС потенциометра положения"
    fields: { Role: R_BOT }
  C2:
    type: TYPE_C_100NF
    description: "C_FB: фильтр АЦП сигнала ОС"
    fields: { Role: C_FB }

nets:
  VCC_12V:
    name: VCC_12V
    description: Силовая шина +12В после фильтра помех L1, с TVS D2 и конденсаторами
    is_hierarchical_port: true
    attributes:
      type: POWER
      voltage_level: 12.0V
      current_max: 5.0A
      spice_simulation:
        model_stimulus: DC 12.0
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
      - { component: U1, pinfunction: 'VM' }    # pin 5, уникальное имя
      - { component: C1, pin: '1' }

  GND:
    name: GND
    description: Общий провод (кузов автомобиля)
    is_hierarchical_port: true
    attributes:
      type: GND
      voltage_level: 0V
      current_max: 5.0A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
      # U1: три GND-пина, имена не уникальны — адресуем по номерам.
      - { component: U1, pin: '1' }             # GND
      - { component: U1, pin: '7' }             # PGND
      - { component: U1, pin: '9' }             # EP
      - { component: C1, pin: '2' }
      - { component: R1, pin: '2' }
      - { component: R3, pin: '2' }
      - { component: C2, pin: '2' }

  IN1:
    name: IN1
    description: Логический вход IN1 драйвера H-моста
    is_hierarchical_port: true
    attributes:
      type: DIGITAL_SIGNAL
      voltage_level: 3.3V
      current_max: 0.02A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
      - { component: U1, pinfunction: 'IN1' }   # pin 3

  IN2:
    name: IN2
    description: Логический вход IN2 драйвера H-моста
    is_hierarchical_port: true
    attributes:
      type: DIGITAL_SIGNAL
      voltage_level: 3.3V
      current_max: 0.02A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
      - { component: U1, pinfunction: 'IN2' }   # pin 2

  MOTOR_A:
    name: MOTOR_A
    description: Выход A H-моста к моторедуктору заслонки
    is_hierarchical_port: true
    attributes:
      type: PWM_POWER
      voltage_level: 0..12.0V
      current_max: 5.0A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
      - { component: U1, pinfunction: 'OUT1' }  # pin 6

  MOTOR_B:
    name: MOTOR_B
    description: Выход B H-моста к моторедуктору заслонки
    is_hierarchical_port: true
    attributes:
      type: PWM_POWER
      voltage_level: 0..12.0V
      current_max: 5.0A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
      - { component: U1, pinfunction: 'OUT2' }  # pin 8

  FB_RAW:
    name: FB_RAW
    description: Выход потенциометра положения (0..5В) с разъёма
    is_hierarchical_port: true
    attributes:
      type: ANALOG_SIGNAL
      voltage_level: 0..5.0V
      current_max: 0.005A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
      - { component: R2, pin: '1' }

  FB:
    name: FB
    description: Сигнал ОС после делителя 5В->3,3В на вход АЦП
    is_hierarchical_port: true
    attributes:
      type: ANALOG_SIGNAL
      voltage_level: 0..3.3V
      current_max: 0.005A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
      - { component: R2, pin: '2' }
      - { component: R3, pin: '1' }
      - { component: C2, pin: '1' }

  ILIM:
    name: ILIM
    description: Установка токоограничения драйвера (внутренний узел)
    is_hierarchical_port: false
    attributes:
      type: DIGITAL_SIGNAL
      voltage_level: 3.3V
      current_max: 0.02A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
      - { component: U1, pinfunction: 'ILIM' }  # pin 4
      - { component: R1, pin: '1' }

# ─────────────────────────────────────────────────────────────────────
# Тестовые сценарии Ngspice для канала заслонки
#
# Драйвер DRV8871 (U1), пины:
#   1 GND, 2 IN2, 3 IN1, 4 ILIM, 5 VM, 6 OUT1 (=MOTOR_A),
#   7 PGND, 8 OUT2 (=MOTOR_B), 9 EP
#
# Логика H-моста:
#   IN1=H, IN2=L  → MOTOR_A ≈ VCC_12V, MOTOR_B ≈ GND  (прямое)
#   IN1=L, IN2=H  → MOTOR_A ≈ GND,     MOTOR_B ≈ VCC  (обратное)
#
# Делитель ОС (R2 = R_TOP, R3 = R_BOT):
#   FB_RAW → R2 (10k) → FB → R3 (20k) → GND
#   K = R3 / (R2 + R3) = 20 / 30 = 2/3
#   При FB_RAW = 5В   → FB = 3,333В
#   При FB_RAW = 2,5В → FB = 1,667В
#
# Мотор: модель DC_MOTOR из motor_model.lib, подключается inline в deck
# каждого сценария. Параметры выбраны под типовой моторедуктор заслонки
# климатической системы:
#   R_arm      = 30 Ω       (пусковой ток 400 мА при 12В)
#   Ke         = 40 В/В     (back-EMF на 1В узла Speed)
#   Kt         = 0.05       (момент на 1А, согласован с R_friction)
#   C_inertia  = 1e-4       (лёгкий ротор, быстрый разгон)
#   R_friction = 30 Ω       (нагрузка на валу)
#
# Расчёт рабочей точки при 14,4В:
#   I = 14.4 / (R_arm + Ke·Kt·R_friction) = 14.4 / (30 + 60) = 0.16 А
#   Speed = I·Kt·R_friction = 0.16·0.05·30 = 0.24 В
# ─────────────────────────────────────────────────────────────────────

scenarios:

  # ─── Электрика H-моста ────────────────────────────────────────────

  - name: ACT_CH_FWD
    description: |
      Канал в прямом направлении.
      IN1 = H (3.3В), IN2 = L (0В) → MOTOR_A ≈ VCC, MOTOR_B ≈ GND.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VCC_12V
          type: dc
          value: 14.4
          description: "Питание H-моста (бортовая сеть под нагрузкой)"

      - source:
          ref: V2
          net: IN1
          type: dc
          value: 3.3
          description: "Логический вход IN1 = лог. 1"

      - source:
          ref: V3
          net: IN2
          type: dc
          value: 0.0
          description: "Логический вход IN2 = лог. 0"

      - motor:
          ref: XM
          include: motor_model.lib
          subckt: DC_MOTOR
          nodes:
            INP:   MOTOR_A
            INN:   MOTOR_B
            SPEED: SPEED
          params:
            R_arm:      30
            L_arm:      50m
            Ke:         40
            Kt:         0.05
            C_inertia:  1e-4
            R_friction: 30
          description: |
            Моторедуктор заслонки, типовые параметры.
            Калибровка:
              R_arm      = 12 / 0.4 = 30 Ω         (пуск 400 мА при 12В)
              Ke         ≈ (12 − 30·0.133)/0.2 = 40 (back-EMF на 1В Speed)
              Kt         = 0.05                    (согласование с R_friction)
              R_friction = 30 Ω                    (нагрузка на валу)
    checks:
      - { node: v(motor_a), min: 13.0, max: 14.5,
          description: "OUT1 под напряжением (прямое плечо)" }
      - { node: v(motor_b), min:  0.0, max:  0.5,
          description: "OUT2 прижат к GND (обратное плечо)" }
      - { node: v(speed),   min:  0.15, max:  0.30,
          description: "мотор вращается вперёд, Speed ≈ 200 об/мин" }

  - name: ACT_CH_REV
    description: |
      Канал в обратном направлении.
      IN1 = L, IN2 = H → MOTOR_A ≈ GND, MOTOR_B ≈ VCC.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VCC_12V
          type: dc
          value: 14.4
          description: "Питание H-моста"

      - source:
          ref: V2
          net: IN1
          type: dc
          value: 0.0
          description: "Логический вход IN1 = лог. 0"

      - source:
          ref: V3
          net: IN2
          type: dc
          value: 3.3
          description: "Логический вход IN2 = лог. 1"

      - motor:
          ref: XM
          include: motor_model.lib
          subckt: DC_MOTOR
          nodes:
            INP:   MOTOR_A
            INN:   MOTOR_B
            SPEED: SPEED
          params:
            R_arm:      30
            L_arm:      50m
            Ke:         40
            Kt:         0.05
            C_inertia:  1e-4
            R_friction: 30
          description: |
            Тот же моторедуктор заслонки, что и в ACT_CH_FWD.
            Полярность питания инвертирована, поэтому Speed
            ожидается отрицательный.
    checks:
      - { node: v(motor_a), min:  0.0, max:  0.5,
          description: "OUT1 прижат к GND" }
      - { node: v(motor_b), min: 13.0, max: 14.5,
          description: "OUT2 под напряжением" }
      - { node: v(speed),   min: -0.30, max: -0.15,
          description: "мотор вращается назад" }

  - name: ACT_CH_COAST
    description: |
      Выбег. IN1 = L, IN2 = L — оба плеча Hi-Z, на моторедуктор
      питание не подаётся. Выходы висят на средней точке VM/2,
      определяемой body-диодами драйвера и обмоткой мотора.
      Ток через мотор = 0, скорость не нарастает.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VCC_12V
          type: dc
          value: 14.4
          description: "Питание H-моста"

      - source:
          ref: V2
          net: IN1
          type: dc
          value: 0.0
          description: "IN1 = лог. 0"

      - source:
          ref: V3
          net: IN2
          type: dc
          value: 0.0
          description: "IN2 = лог. 0"

      - motor:
          ref: XM
          include: motor_model.lib
          subckt: DC_MOTOR
          nodes:
            INP:   MOTOR_A
            INN:   MOTOR_B
            SPEED: SPEED
          params:
            R_arm:      30
            L_arm:      50m
            Ke:         40
            Kt:         0.05
            C_inertia:  1e-4
            R_friction: 30
          description: "Тот же моторедуктор, без питания"
    control: |
      let vsw = v(MOTOR_A) - v(MOTOR_B)
      let vspeed = v(SPEED)
      print v(motor_a) v(motor_b) vsw vspeed
    checks:
      - node: v(motor_a)
        min: 0.0
        max: 14.5
        description: "OUT1 Hi-Z, потенциал определяется делителем body-диодов (~7,2В)"
      - node: v(motor_b)
        min: 0.0
        max: 14.5
        description: "OUT2 Hi-Z, потенциал определяется делителем body-диодов (~7,2В)"
      - node: vsw
        min: -0.05
        max: 0.05
        description: "нет дифференциального напряжения на моторе (v(A)−v(B) ≈ 0)"
      - node: vspeed
        min: -0.01
        max: 0.01
        description: "мотор не вращается (нет тока якоря)"

  - name: ACT_CH_BRAKE
    description: |
      Тормоз. IN1 = H, IN2 = H — оба плеча low-side, мотор
      замкнут через нижние ключи. Выходы прижаты к GND.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VCC_12V
          type: dc
          value: 14.4
          description: "Питание H-моста"

      - source:
          ref: V2
          net: IN1
          type: dc
          value: 3.3
          description: "IN1 = лог. 1"

      - source:
          ref: V3
          net: IN2
          type: dc
          value: 3.3
          description: "IN2 = лог. 1"

      - motor:
          ref: XM
          include: motor_model.lib
          subckt: DC_MOTOR
          nodes:
            INP:   MOTOR_A
            INN:   MOTOR_B
            SPEED: SPEED
          params:
            R_arm:      30
            L_arm:      50m
            Ke:         40
            Kt:         0.05
            C_inertia:  1e-4
            R_friction: 30
          description: "Тот же моторедуктор, обе клеммы на GND"
    checks:
      - { node: v(motor_a), min: -0.5, max: 0.5,
          description: "OUT1 прижат к GND" }
      - { node: v(motor_b), min: -0.5, max: 0.5,
          description: "OUT2 прижат к GND" }

  # ─── Делитель ОС потенциометра ────────────────────────────────────
  #
  # Эти сценарии проверяют только делитель FB_RAW → R2 → FB → R3 → GND,
  # но поднимают весь лист целиком, включая DRV8871. Чтобы рабочая
  # точка сходилась, входы драйвера закреплены нулевыми источниками,
  # а выходы — tie-down резисторами. На v(fb) они не влияют.

  - name: ACT_CH_FB_MIN
    description: |
      Делитель ОС при минимальном положении потенциометра.
      0В на FB_RAW → 0В на FB.
    analysis: op
    deck:
      - source:
          ref: V1
          net: FB_RAW
          type: dc
          value: 0.0
          description: "Потенциометр заслонки в крайнем положении (0В)"

      # Закрепление входов DRV8871 для сходимости рабочей точки.
      - source:
          ref: V2
          net: VCC_12V
          type: dc
          value: 0.0
          description: "VM драйвера = 0 (в этом сценарии не используется)"
      - source:
          ref: V3
          net: IN1
          type: dc
          value: 0.0
          description: "IN1 = 0 (драйвер в coast)"
      - source:
          ref: V4
          net: IN2
          type: dc
          value: 0.0
          description: "IN2 = 0 (драйвер в coast)"
      - resistor:
          ref: R_MA
          net_pos: MOTOR_A
          net_neg: "0"
          value: 1Meg
          description: "Tie-down выхода A драйвера"
      - resistor:
          ref: R_MB
          net_pos: MOTOR_B
          net_neg: "0"
          value: 1Meg
          description: "Tie-down выхода B драйвера"

    checks:
      - { node: v(fb), min: -0.05, max: 0.05,
          description: "нижний край диапазона АЦП" }

  - name: ACT_CH_FB_MID
    description: |
      Делитель ОС в среднем положении.
      2,5В на FB_RAW → ~1,67В на FB (K = 2/3).
    analysis: op
    deck:
      - source:
          ref: V1
          net: FB_RAW
          type: dc
          value: 2.5
