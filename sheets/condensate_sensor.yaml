functional_purpose: |
  Модуль измерения конденсата на стекле.

  Внешний датчик конденсата питается от +5В (J1:17) и выдаёт
  аналоговый сигнал 0..5В на линию COND_IN_RAW (J1:21). Резистивный
  делитель R29 (10к) / R30 (20к) масштабирует сигнал до 0..3,3В
  для входа АЦП микроконтроллера (COND_ADC). Конденсатор C27
  фильтрует ВЧ-помехи. Стабилитрон D28 (3,6В) защищает вход АЦП
  от затекания +12В в линию COND_IN_RAW.

  Коэффициент деления:
    K = R30 / (R29 + R30) = 20 / 30 = 2/3

  Характерные точки:
    COND_IN_RAW = 0В    → COND_ADC = 0В
    COND_IN_RAW = 2,5В  → COND_ADC ≈ 1,67В
    COND_IN_RAW = 5В    → COND_ADC ≈ 3,33В
    COND_IN_RAW = 12В   → COND_ADC ≈ 3,7В (ограничен D28)

# Модели R/C не объявляются: на листе только примитивы SPICE,
# строятся по part. D28 — primitive: D с inline .model.

ports:
- net_label: GND
  type: POWER
  description: Общий провод (кузов автомобиля)
- net_label: COND_IN_RAW
  type: INPUT
  description: Вход датчика конденсата на стекле (0..5В), J1:21
- net_label: COND_ADC
  type: OUTPUT
  description: Сигнал конденсата после делителя 5В->3,3В на АЦП

component_types:
  TYPE_C_100NF:
    symbol: Device:C
    footprint: Capacitor_SMD:C_0603_1608Metric
    value: 100n
    fields:
      Type: Ceramic
      Dielectric: X7R

  TYPE_R_10K:
    symbol: Device:R
    footprint: Resistor_SMD:R_0603_1608Metric
    value: 10k
    fields:
      Power: 0.1W
      Tolerance: 1%

  TYPE_R_20K:
    symbol: Device:R
    footprint: Resistor_SMD:R_0603_1608Metric
    value: 20k
    fields:
      Power: 0.1W
      Tolerance: 1%

  TYPE_D_ZENER_3V6:
    symbol: Device:D_Zener
    footprint: Diode_SMD:D_SOD-123
    value: BZX84C3V6
    fields: { Voltage: 3.6V }
    spice:
      description: |
        Стабилитрон 3,6В для защиты входа АЦП.
        При V(COND_ADC) < 3,6В — заперт, сигнал идёт через делитель.
        При V > 3,6В (аварийное затекание +12В) — открывается,
        ограничивает COND_ADC на уровне BV + I·Rz ≈ 3,7В.
        Распиновка Device:D_Zener: pin 1 = K, pin 2 = A.
      primitive: D
      model_def: ".model D_ZENER_3V6 D(IS=1e-14 RS=100 N=1.05 BV=3.6 IBV=1m CJO=50p)"

components:
  C27:
    type: TYPE_C_100NF
    description: "Фильтр АЦП сигнала конденсата"
  R29:
    type: TYPE_R_10K
    description: "Делитель сигнала конденсата, верхнее плечо"
  R30:
    type: TYPE_R_20K
    description: "Делитель сигнала конденсата, нижнее плечо"
  D28:
    type: TYPE_D_ZENER_3V6
    description: "Защитный стабилитрон входа АЦП конденсата"

nets:
  GND:
    name: GND
    description: Общий провод (кузов автомобиля)
    is_hierarchical_port: true
    attributes:
      type: GND
      voltage_level: 0V
      current_max: 15A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: R30, pin: '2' }
    - { component: C27, pin: '2' }
    - { component: D28, pinfunction: 'A' }   # анод стабилитрона на GND

  COND_IN_RAW:
    name: COND_IN_RAW
    description: Вход датчика конденсата на стекле (0..5В), J1:21
    is_hierarchical_port: true
    attributes:
      type: ANALOG_SIGNAL
      voltage_level: 0..5.0V
      current_max: 0.005A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: R29, pin: '1' }

  COND_ADC:
    name: COND_ADC
    description: Сигнал конденсата после делителя 5В->3,3В на АЦП
    is_hierarchical_port: true
    attributes:
      type: ANALOG_SIGNAL
      voltage_level: 0..3.3V
      current_max: 0.005A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: R29, pin: '2' }
    - { component: R30, pin: '1' }
    - { component: C27, pin: '1' }
    - { component: D28, pinfunction: 'K' }   # катод стабилитрона на ADC

# ─────────────────────────────────────────────────────────────────────
# Тестовые сценарии Ngspice
#
# Делитель R29 (10к) / R30 (20к):
#   K = 20 / (10 + 20) = 2/3
#
# Защитный стабилитрон D28 (BV = 3,6В, Rz ≈ 100 Ом):
#   при V(COND_ADC) < 3,6В — заперт, на сигнал не влияет;
#   при V ≥ 3,6В — открывается, ограничивает узел.
#
# Проверяем:
#   0В (сухо)      → COND_ADC = 0В
#   2,5В (роса)    → COND_ADC ≈ 1,67В
#   5В (поток)     → COND_ADC ≈ 3,33В (стабилитрон ещё закрыт)
#   12В (авария)   → COND_ADC ≈ 3,7В (ограничен стабилитроном)
# ─────────────────────────────────────────────────────────────────────

scenarios:

  - name: SEN_COND_DRY
    description: |
      Сухое стекло, датчик выдаёт 0В.
      COND_ADC = 0В.
    analysis: op
    deck:
      - source:
          ref: V1
          net: COND_IN_RAW
          type: dc
          value: 0.0
          description: "Датчик конденсата: сухо (0В)"
    checks:
      - { node: v(cond_adc), min: -0.05, max: 0.05,
          description: "COND_ADC = 0В (нижний край диапазона)" }

  - name: SEN_COND_MID
    description: |
      Датчик в среднем положении — начало конденсации.
      COND_IN_RAW = 2,5В → COND_ADC ≈ 1,67В (K = 2/3).
    analysis: op
    deck:
      - source:
          ref: V1
          net: COND_IN_RAW
          type: dc
          value: 2.5
          description: "Датчик конденсата: середина диапазона (2,5В)"
    checks:
      - { node: v(cond_adc), min: 1.55, max: 1.80,
          description: "середина диапазона АЦП ≈ 1,67В" }

  - name: SEN_COND_WET
    description: |
      Датчик в крайнем положении — сильная конденсация.
      COND_IN_RAW = 5В → COND_ADC ≈ 3,33В. Стабилитрон ещё заперт
      (BV = 3,6В), на сигнал не влияет.
    analysis: op
    deck:
      - source:
          ref: V1
          net: COND_IN_RAW
          type: dc
          value: 5.0
          description: "Датчик конденсата: крайнее положение (5В)"
    checks:
      - { node: v(cond_adc), min: 3.20, max: 3.45,
          description: "верхний край диапазона АЦП ≈ 3,33В" }

  - name: SEN_COND_FAULT_12V
    description: |
      Аварийный режим: замыкание линии COND_IN_RAW на бортсеть +12В.

      Проверяем, что стабилитрон D28 защищает вход АЦП:
      без него делитель дал бы 12 · 2/3 = 8В, что повредило бы МК.
      С D28 узел COND_ADC ограничен уровнем BV + I·Rz ≈ 3,7В.

      Ток через стабилитрон: (12 − 3,7)/10k ≈ 0,83 мА — безопасен
      для SOD-123 (допустимо до десятков мА при коротких импульсах).
    analysis: op
    deck:
      - source:
          ref: V1
          net: COND_IN_RAW
          type: dc
          value: 12.0
          description: "Аварийный режим: замыкание COND_IN_RAW на +12В"
    control: |
      let vadc = v(COND_ADC)
      let iz   = (12.0 - v(COND_ADC)) / 10k
      print vadc iz
    checks:
      - node: vadc
        min: 3.4
        max: 3.8
        description: "COND_ADC ограничен D28 на уровне ≈ 3,7В (безопасно для STM32)"
      - node: iz
        min: 0.0006
        max: 0.0010
        description: "ток через стабилитрон ≈ 0,83 мА (в пределах нормы SOD-123)"