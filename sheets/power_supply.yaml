nets:
  VBAT_IN:
    name: VBAT_IN
    description: Входное бортовое питание +12В, выводы 1-2 разъёма J1
    is_hierarchical_port: false
    attributes:
      type: POWER
      voltage_level: 12.0V
      current_max: 15A
      spice_simulation:
        model_stimulus: DC 12.0
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: J1, pin: '1' }
    - { component: J1, pin: '2' }
    - { component: D1, pinfunction: 'A' }    # анод на вход — ток идёт от входа в диод

  VBAT_PROT:
    name: VBAT_PROT
    description: После защиты от переполюсовки (D1), перед фильтром L1
    is_hierarchical_port: false
    attributes:
      type: POWER
      voltage_level: 12.0V
      current_max: 15A
      spice_simulation:
        model_stimulus: DC 12.0
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: D1, pinfunction: 'K' }    # катод на защищённой стороне
    - { component: L1, pin: '1' }

  VCC_12V:
    name: VCC_12V
    description: Силовая шина +12В после фильтра помех L1, с TVS D2 и конденсаторами
    is_hierarchical_port: true
    attributes:
      type: POWER
      voltage_level: 12.0V
      current_max: 15A
      spice_simulation:
        model_stimulus: DC 12.0
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: L1,  pin: '2' }
    - { component: D2,  pinfunction: 'K' }   # катод TVS на защищаемой шине
    - { component: C1,  pin: '1' }
    - { component: C2,  pin: '1' }
    - { component: C20, pin: '1' }
    - { component: C3,  pin: '1' }
    - { component: U6,  pin: '1' }
    - { component: C11, pin: '1' }

  VCC_5V:
    name: VCC_5V
    description: Внутреннее стабилизированное питание +5В (логика/питание стабилизатора 3,3В)
    is_hierarchical_port: true
    attributes:
      type: POWER
      voltage_level: 5.0V
      current_max: 0.5A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: U6, pin: '3' }
    - { component: C4, pin: '1' }
    - { component: U7, pin: '1' }
    - { component: D4, pinfunction: 'A' }    # анод на VCC_5V — ток течёт в V5_SENS

  V5_SENS:
    name: V5_SENS
    description: Общий выход +5В на датчики и края потенциометров ОС (J1:17). D4 исключает обратную подачу +12В снаружи
    is_hierarchical_port: false
    attributes:
      type: POWER
      voltage_level: 5.0V
      current_max: 0.1A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: D4,  pinfunction: 'K' }    # катод на V5_SENS — диод развязки
    - { component: D5,  pinfunction: 'K' }    # катод TVS на защищаемой шине
    - { component: C16, pin: '1' }
    - { component: C17, pin: '1' }
    - { component: C18, pin: '1' }
    - { component: C19, pin: '1' }
    - { component: J1,  pin: '17' }

  VCC_3V3:
    name: VCC_3V3
    description: Логическое питание +3,3В микроконтроллера и фронт-панели
    is_hierarchical_port: true
    attributes:
      type: POWER
      voltage_level: 3.3V
      current_max: 0.3A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: U7, pin: '3' }

  GND:
    name: GND
    description: Общий провод (кузов автомобиля)
    is_hierarchical_port: true
    attributes:
      type: GND
      voltage_level: 0V
      current_max: 15A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: J1,  pin: '3' }
    - { component: J1,  pin: '4' }
    - { component: J1,  pin: '18' }
    - { component: U6,  pin: '2' }
    - { component: U7,  pin: '2' }
    - { component: C20, pin: '2' }
    - { component: D5,  pinfunction: 'A' }    # анод TVS на GND
    - { component: D2,  pinfunction: 'A' }    # анод TVS на GND
    - { component: C1,  pin: '2' }
    - { component: C2,  pin: '2' }
    - { component: C3,  pin: '2' }
    - { component: C4,  pin: '2' }
    - { component: C11, pin: '2' }
    - { component: C16, pin: '2' }
    - { component: C17, pin: '2' }
    - { component: C18, pin: '2' }
    - { component: C19, pin: '2' }

  NTC_HEAT_W:
    name: NTC_HEAT_W
    description: 'Датчик патрубка отопителя: узел линии на разъёме J1:19'
    is_hierarchical_port: true
    attributes:
      type: ANALOG_SIGNAL
      voltage_level: 0..3.3V
      current_max: 0.005A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: J1, pin: '19' }

  SOLAR_IN_RAW:
    name: SOLAR_IN_RAW
    description: Вход датчика солнечной радиации (0..5В), J1:20
    is_hierarchical_port: true
    attributes:
      type: ANALOG_SIGNAL
      voltage_level: 0..5.0V
      current_max: 0.005A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: J1, pin: '20' }

  COND_IN_RAW:
    name: COND_IN_RAW
    description: Вход датчика конденсата на стекле (0..5В), J1:21
    is_hierarchical_port: true
    attributes:
      type: ANALOG_SIGNAL
      voltage_level: 0..5.0V
      current_max: 0.005A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: J1, pin: '21' }

  MOTOR_1_A:
    name: MOTOR_1_A
    description: 'Заслонка 1: выход А мостового драйвера к моторедуктору, J1:5'
    is_hierarchical_port: true
    attributes:
      type: PWM_POWER
      voltage_level: 0..12.0V
      current_max: 5.0A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: J1, pin: '5' }

  MOTOR_1_B:
    name: MOTOR_1_B
    description: 'Заслонка 1: выход B мостового драйвера к моторедуктору, J1:6'
    is_hierarchical_port: true
    attributes:
      type: PWM_POWER
      voltage_level: 0..12.0V
      current_max: 5.0A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: J1, pin: '6' }

  FB_M1_RAW:
    name: FB_M1_RAW
    description: 'Заслонка 1: выход потенциометра положения (0..5В), J1:7'
    is_hierarchical_port: true
    attributes:
      type: ANALOG_SIGNAL
      voltage_level: 0..5.0V
      current_max: 0.005A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: J1, pin: '7' }

  MOTOR_2_A:
    name: MOTOR_2_A
    description: 'Заслонка 2: выход А мостового драйвера к моторедуктору, J1:8'
    is_hierarchical_port: true
    attributes:
      type: PWM_POWER
      voltage_level: 0..12.0V
