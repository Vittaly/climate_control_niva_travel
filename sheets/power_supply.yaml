page_name: PWR
file: power_supply.kicad_sch
functional_purpose: |
  Модуль питания и автомобильного разъёма J1.

  Состав:
    * Вход +12В (J1:1,2) → защита от переполюсовки D1 (SS54) →
      фильтр помех L1 (феррит/дроссель) → TVS D2 (SMBJ15A) →
      выход VCC_12V.
    * Стабилизатор +5В U6 (MC78M05CDTG, 0,5А) → VCC_5V.
    * Далее LDO +3,3В U7 (AMS1117-3.3) → VCC_3V3.
    * Диодная развязка D4 (SS14) между VCC_5V и линией питания
      датчиков V5_SENS: защищает внутренний +5В от обратной
      подачи +12В через разъём J1:17.
    * TVS D5 (SMBJ5.0A) защищает V5_SENS.
    * Набор конденсаторов C1..C11, C16..C20 по питанию и
      фильтрам опор потенциометров ОС.

  Через J1 (2×16) выходят все внешние подключения:
  питание, мотор-выходы, ОС потенциометров, датчики,
  ШИМ вентилятора, подсветка, CAN, AC_REQ_OUT.

  В SPICE:
    * U6 и U7 — модели из main.yaml.spice.component_models
      (LM78M05_TO252, AP1117-15);
    * диоды — .model из листа spice.models;
    * нагрузки на VCC_5V/VCC_3V3/VCC_12V задаются в сценарии.

ports:
- net_label: VCC_12V
  type: POWER
  description: Силовая шина +12В после фильтра помех L1, с TVS D2 и конденсаторами
- net_label: VCC_5V
  type: POWER
  description: Внутреннее стабилизированное питание +5В (логика/питание стабилизатора 3,3В)
- net_label: VCC_3V3
  type: POWER
  description: Логическое питание +3,3В микроконтроллера и фронт-панели
- net_label: GND
  type: POWER
  description: Общий провод (кузов автомобиля)
- net_label: NTC_HEAT_W
  type: OUTPUT
  description: 'Датчик патрубка отопителя: узел линии на разъёме J1:19'
- net_label: SOLAR_RAW
  type: INPUT
  description: Выход датчика солнечной радиации (0..5В), J1:20
- net_label: COND_RAW
  type: INPUT
  description: Выход датчика конденсата на стекле (0..5В), J1:21
- net_label: MOTOR_1_A
  type: OUTPUT
  description: 'Заслонка 1: выход А мостового драйвера к моторедуктору, J1:5'
- net_label: MOTOR_1_B
  type: OUTPUT
  description: 'Заслонка 1: выход B мостового драйвера к моторедуктору, J1:6'
- net_label: FB_M1_RAW
  type: INPUT
  description: 'Заслонка 1: выход потенциометра положения (0..5В), J1:7'
- net_label: MOTOR_2_A
  type: OUTPUT
  description: 'Заслонка 2: выход А мостового драйвера к моторедуктору, J1:8'
- net_label: MOTOR_2_B
  type: OUTPUT
  description: 'Заслонка 2: выход B мостового драйвера к моторедуктору, J1:9'
- net_label: FB_M2_RAW
  type: INPUT
  description: 'Заслонка 2: выход потенциометра положения (0..5В), J1:10'
- net_label: MOTOR_3_A
  type: OUTPUT
  description: 'Заслонка 3: выход А мостового драйвера к моторедуктору, J1:11'
- net_label: MOTOR_3_B
  type: OUTPUT
  description: 'Заслонка 3: выход B мостового драйвера к моторедуктору, J1:12'
- net_label: FB_M3_RAW
  type: INPUT
  description: 'Заслонка 3: выход потенциометра положения (0..5В), J1:13'
- net_label: MOTOR_4_A
  type: OUTPUT
  description: 'Заслонка 4: выход А мостового драйвера к моторедуктору, J1:14'
- net_label: MOTOR_4_B
  type: OUTPUT
  description: 'Заслонка 4: выход B мостового драйвера к моторедуктору, J1:15'
- net_label: FB_M4_RAW
  type: INPUT
  description: 'Заслонка 4: выход потенциометра положения (0..5В), J1:16'
- net_label: AC_REQ_OUT
  type: INPUT
  description: Линия запроса кондиционера +12В к J1:24 (вход ЭБУ двигателя)
- net_label: ILLUM_IN_RAW
  type: POWER
  description: |
    Аналоговое питание подсветки прибора с выхода внешнего
    регулятора яркости (диммера), J1:22. Диапазон 1..14,4В.
    Используется как питание LED-каналов в BACKLIGHT и как
    сигнал детектора габаритов в UI (делитель R39/R40).
- net_label: CANH
  type: OUTPUT
  description: 'CAN: шина High (J1:25)'
- net_label: CANL
  type: OUTPUT
  description: 'CAN: шина Low (J1:26)'
- net_label: HEAT_FAN_PWM_CTL
  type: OUTPUT
  description: ШИМ вентилятора печки к J1:23 (с открытого стока Q1 через R15)

