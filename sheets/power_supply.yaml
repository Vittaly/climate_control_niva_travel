functional_purpose: |
  Модуль питания и автомобильного разъёма J1.

  Состав:
    * Вход +12В (J1:1,2) → защита от переполюсовки D1 (SS54) →
      фильтр помех L1 (феррит/дроссель) → TVS D2 (SMBJ15A) →
      выход VCC_12V.
    * Стабилизатор +5В U6 (MC78M05CDTG, 0,5А) → VCC_5V.
    * Далее LDO +3,3В U7 (AMS1117-3.3) → VCC_3V3.
    * Диодная развязка D4 (SS14) между VCC_5V и линией питания
      датчиков V5_SENS: защищает внутренний +5В от обратной
      подачи +12В через разъём J1:17.
    * TVS D5 (SMBJ5.0A) защищает V5_SENS.
    * Набор конденсаторов C1..C11, C16..C20 по питанию и
      фильтрам опор потенциометров ОС.

  Через J1 (2×16) выходят все внешние подключения:
  питание, мотор-выходы, ОС потенциометров, датчики,
  ШИМ вентилятора, подсветка, CAN, AC_REQ_OUT.

  В SPICE:
    * U6, U7 — subckt-модели в mc78m05_ngspice.lib и
      ams1117_33_ngspice.lib;
    * D1, D2, D4, D5 — primitive: D с inline .model;
    * R/C/L — примитивы, spice не требуют
      (у L1 SPICE-значение задано через spice.value);
    * нагрузки на VCC_5V/VCC_3V3/VCC_12V задаются в сценарии.

  Полярность диодов (KiCad Device:D, Device:D_Schottky, Device:D_Zener):
    pin 1 = K (катод), pin 2 = A (анод).
    Имена выводов уникальны → в nets: связи задаются pinfunction.
    D1: A=VBAT_IN, K=VBAT_PROT     (проводит прямой ток в норме)
    D2: K=VCC_12V, A=GND           (TVS, клиппит выброс выше BV)
    D4: A=VCC_5V,  K=V5_SENS       (развязка, не пускает обратно)
    D5: K=V5_SENS, A=GND           (TVS, клиппит V5_SENS)

ports:
- net_label: VCC_12V
  type: POWER
  description: Силовая шина +12В после фильтра помех L1, с TVS D2 и конденсаторами
- net_label: VCC_5V
  type: POWER
  description: Внутреннее стабилизированное питание +5В (логика/питание стабилизатора 3,3В)
- net_label: VCC_3V3
  type: POWER
  description: Логическое питание +3,3В микроконтроллера и фронт-панели
- net_label: GND
  type: POWER
  description: Общий провод (кузов автомобиля)
- net_label: NTC_HEAT_W
  type: OUTPUT
  description: 'Датчик патрубка отопителя: узел линии на разъёме J1:19'
- net_label: SOLAR_IN_RAW
  type: INPUT
  description: Вход датчика солнечной радиации (0..5В), J1:20
- net_label: COND_IN_RAW
  type: INPUT
  description: Вход датчика конденсата на стекле (0..5В), J1:21
- net_label: MOTOR_1_A
  type: OUTPUT
  description: 'Заслонка 1: выход А мостового драйвера к моторедуктору, J1:5'
- net_label: MOTOR_1_B
  type: OUTPUT
  description: 'Заслонка 1: выход B мостового драйвера к моторедуктору, J1:6'
- net_label: FB_M1_RAW
  type: INPUT
  description: 'Заслонка 1: выход потенциометра положения (0..5В), J1:7'
- net_label: MOTOR_2_A
  type: OUTPUT
  description: 'Заслонка 2: выход А мостового драйвера к моторедуктору, J1:8'
- net_label: MOTOR_2_B
  type: OUTPUT
  description: 'Заслонка 2: выход B мостового драйвера к моторедуктору, J1:9'
- net_label: FB_M2_RAW
  type: INPUT
  description: 'Заслонка 2: выход потенциометра положения (0..5В), J1:10'
- net_label: MOTOR_3_A
  type: OUTPUT
  description: 'Заслонка 3: выход А мостового драйвера к моторедуктору, J1:11'
- net_label: MOTOR_3_B
  type: OUTPUT
  description: 'Заслонка 3: выход B мостового драйвера к моторедуктору, J1:12'
- net_label: FB_M3_RAW
  type: INPUT
  description: 'Заслонка 3: выход потенциометра положения (0..5В), J1:13'
- net_label: MOTOR_4_A
  type: OUTPUT
  description: 'Заслонка 4: выход А мостового драйвера к моторедуктору, J1:14'
- net_label: MOTOR_4_B
  type: OUTPUT
  description: 'Заслонка 4: выход B мостового драйвера к моторедуктору, J1:15'
- net_label: FB_M4_RAW
  type: INPUT
  description: 'Заслонка 4: выход потенциометра положения (0..5В), J1:16'
- net_label: AC_REQ_OUT
  type: INPUT
  description: Линия запроса кондиционера +12В к J1:24 (вход ЭБУ двигателя)
- net_label: ILLUM_IN_RAW
  type: POWER
  description: |
    Аналоговое питание подсветки прибора с выхода внешнего
    регулятора яркости (диммера), J1:22. Диапазон 1..14,4В.
    Используется как питание LED-каналов в BACKLIGHT и как
    сигнал детектора габаритов в UI (делитель R39/R40).
- net_label: CANH
  type: OUTPUT
  description: 'CAN: шина High (J1:25)'
- net_label: CANL
  type: OUTPUT
  description: 'CAN: шина Low (J1:26)'
- net_label: HEAT_FAN_PWM_CTL
  type: OUTPUT
  description: ШИМ вентилятора печки к J1:23 (с открытого стока Q1 через R15)

component_types:
  TYPE_C_470UF_25V:
    symbol: Device:C
    footprint: Capacitor_SMD:CP_Elec_10x10.5
    value: 470u
    fields: { Voltage: 25V, Type: Aluminum Electrolytic }

  TYPE_C_100UF_25V:
    symbol: Device:C
    footprint: Capacitor_SMD:CP_Elec_8x10.5
    value: 100u
    fields: { Voltage: 25V, Type: Aluminum Electrolytic }

  TYPE_C_100NF:
    symbol: Device:C
    footprint: Capacitor_SMD:C_0603_1608Metric
    value: 100n
    fields: { Type: Ceramic, Dielectric: X7R }

  TYPE_C_100NF_12V:
    symbol: Device:C
    footprint: Capacitor_SMD:C_0603_1608Metric
    value: 100n
    fields: { Voltage: 12V, Type: Ceramic, Dielectric: X7R }

  TYPE_C_1UF_25V:
    symbol: Device:C
    footprint: Capacitor_SMD:C_0805_2012Metric
    value: 1u
    fields: { Voltage: 25V, Type: Ceramic, Dielectric: X7R }

  TYPE_C_10UF_35V:
    symbol: Device:C
    footprint: Capacitor_SMD:C_0805_2012Metric
    value: 10u
    fields: { Voltage: 35V, Type: Ceramic, Dielectric: X7R }

  TYPE_C_10UF_10V:
    symbol: Device:C
    footprint: Capacitor_SMD:C_0805_2012Metric
    value: 10u
    fields: { Voltage: 10V, Type: Ceramic, Dielectric: X7R }

  TYPE_D_SCHOTTKY_SS54:
    symbol: Device:D_Schottky
    footprint: Diode_SMD:D_SMA
    value: SS54
    fields: { Voltage: 40V }
    spice:
      description: "Шоттки 5А/40В (D1, защита от переполюсовки)"
      primitive: D
      model_def: ".model D_SS54 D(IS=4.35e-9 RS=0.05 BV=40)"

  TYPE_D_ZENER_TVS24:
    symbol: Device:D_Zener
    footprint: Diode_SMD:D_SMB
    value: SMBJ15A TVS
    fields: { Voltage: 15V }
    spice:
      description: |
        TVS SMBJ15A, BV = 24В — напряжение клиппинга при load-dump.
        При штатных 14,4В диод закрыт, ток утечки пренебрежим.
      primitive: D
      model_def: ".model TVS24 D(IS=1e-14 RS=0.05 BV=24 IBV=1m N=1.05 CJO=200p)"

  TYPE_D_SCHOTTKY_SS14:
    symbol: Device:D_Schottky
    footprint: Diode_SMD:D_SMA
    value: SS14
    fields: { Voltage: 12V }
    spice:
      description: "Шоттки 1А/40В (D4, диодная развязка V5_SENS)"
      primitive: D
      model_def: ".model D_SS14 D(IS=4.35e-9 RS=0.05 BV=40)"

  TYPE_D_ZENER_TVS5:
    symbol: Device:D_Zener
    footprint: Diode_SMD:D_SMB
    value: SMBJ5.0A / 5,6В
    fields: { Voltage: 5.6V }
    spice:
      description: |
        TVS SMBJ5.0A, BV = 5,6В (D5, защита V5_SENS).
        RS = 0.05 Ом — динамическое сопротивление в пробое,
        соответствует V_clamp ≈ 9.2В @ 65.2А из даташита.
      primitive: D
      model_def: ".model TVS5 D(IS=4.35e-9 RS=0.05 BV=5.6 IBV=1m N=1.05 CJO=200p)"

  TYPE_CONN_02X16:
    symbol: Connector_Generic:Conn_02x16_Odd_Even
    footprint: Connector_PinHeader_2.54mm:PinHeader_2x16_P2.54mm_Horizontal
    value: Разъём к автомобилю 2x16 (32 конт.)
    fields: {}

  TYPE_L_FERRITE_12V:
    symbol: Device:L
    footprint: Inductor_SMD:L_1210_3225Metric
    value: Феррит/дроссель по входу +12В (помехи)
    fields: { Voltage: 12V }
    spice:
      value: 2.2u
      description: |
        Входной ферритовый дроссель +12В. Эквивалентная
        индуктивность ~2.2 мкГн в рабочей полосе 1–30 МГц.
        Реальный компонент — Murata BLM21BB600SN1
        (60 Ω @ 100 МГц, Isat ≥ 3 А, DCR 0.15 Ω).

  TYPE_REG_5V_MC78M05:
    symbol: Regulator_Linear:LM78M05_TO252
    footprint: Package_TO_SOT_SMD:TO-252-3_TabPin2
    value: MC78M05CDTG
    fields: { Voltage: 5V }
    spice:
      description: |
        Линейный стабилизатор +5В, 0.5А, MC78M05CDTG (TO-252).
      include: mc78m05_ngspice.lib
      subckt: MC78M05
      nodes:
        IN:  { pin: "1" }
        GND: { pin: "2" }
        OUT: { pin: "3" }
      required_params: []

  TYPE_LDO_3V3_AMS1117:
    symbol: Regulator_Linear:AP1117-15
    footprint: Package_TO_SOT_SMD:SOT-223-3_TabPin2
    value: AMS1117-3.3
    fields: { Voltage: 3.3V }
    spice:
      description: |
        LDO +3.3В, 1А, AMS1117-3.3 (SOT-223).
      include: ams1117_33_ngspice.lib
      subckt: AMS1117_33
      nodes:
        IN:  { pin: "1" }
        GND: { pin: "2" }
        OUT: { pin: "3" }
      required_params: []

components:
  C1:
    type: TYPE_C_470UF_25V
