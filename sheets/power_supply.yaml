spice:
  models:
    - "D_SS54 D(IS=4.35e-9 RS=0.05 BV=40)"
    - "D_SS14 D(IS=4.35e-9 RS=0.05 BV=40)"
    - "TVS24 D(IS=4.35e-9 RS=0.64 BV=24)"
    - "TVS5  D(IS=4.35e-9 RS=0.64 BV=5.6)"

# ─────────────────────────────────────────────────────────────────────
# Тестовые сценарии Ngspice
#
# Проверяем ключевые защитные и питающие функции листа:
#
#   PWR_P1 — переполюсовка входа: VBAT_IN = -14В, V(VBAT_PROT) ≈ 0
#   PWR_P2 — load-dump: VBAT_IN = 40В, TVS D2 клиппит VCC_12V ≤ 24В
#   PWR_P3 — стабильность VCC_5V: VBAT_IN = 14,4В + нагрузка
#   PWR_P5 — стабильность VCC_3V3: VCC_5V подаётся, U7 выдаёт 3,3В
#   PWR_P6 — обратная подача +12В на V5_SENS через J1:17:
#            D4 (SS14) блокирует, V(VCC_5V) не растёт
#
# U6 (LM78M05) и U7 (AMS1117) — модели из main.yaml.spice.
# Нагрузки задаются резисторами в deck.
# ─────────────────────────────────────────────────────────────────────

scenarios:

  - name: PWR_P1
    description: |
      Переполюсовка входа: на J1:1,2 подан −14В.
      D1 (SS54) в обратном включении — ток ≈ 0,
      VBAT_PROT и VCC_12V остаются в нуле.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VBAT_IN
          type: dc
          value: -14.0
          description: "Аварийная переполюсовка входа −14В"
    checks:
      - { node: v(vbat_prot), min: -1.0, max: 1.0,
          description: "VBAT_PROT ≈ 0 (диод заперт)" }
      - { node: v(vcc_12v),   min: -1.0, max: 1.0,
          description: "VCC_12V ≈ 0 (нет питания)" }

  - name: PWR_P2
    description: |
      Load-dump: на входе 40В (импульсный выброс от индуктивной
      нагрузки). TVS D2 (SMBJ15A) клиппит шину VCC_12V до ~24В.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VBAT_IN
          type: dc
          value: 40.0
          description: "Аварийный выброс +40В"
    control: |
      let v12 = v(VCC_12V)
      let id2 = i(V1)
      print v12 id2
    checks:
      - { node: v12, min: 0.0, max: 24.0,
          description: "VCC_12V клиппится TVS до ≤ 24В" }
      - { node: id2, min: -5.0, max: 0.0,
          description: "TVS проводит ток в нагрузку" }

  - name: PWR_P3
    description: |
      Номинальный режим питания +5В.
      VBAT_IN = 14,4В, U6 (MC78M05) выдаёт +5В.
      Нагрузка имитируется резистором 100 Ом на VCC_5V.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VBAT_IN
          type: dc
          value: 14.4
          description: "Номинальная бортсеть +14,4В"
      - resistor:
          ref: R_L5V
          net_pos: VCC_5V
          net_neg: "0"
          value: 100
          description: "Нагрузка на +5В ≈ 50 мА"
    checks:
      - { node: v(vcc_5v), min: 4.75, max: 5.25,
          description: "VCC_5V = 5,0В ±5% (U6 в норме)" }

  - name: PWR_P5
    description: |
      Номинальный режим +3,3В.
      VBAT_IN = 14,4В → U6 → VCC_5V → U7 (AMS1117-3.3) → VCC_3V3.
      Нагрузка 100 Ом на +3,3В (33 мА).
    analysis: op
    deck:
      - source:
          ref: V1
          net: VBAT_IN
          type: dc
          value: 14.4
          description: "Номинальная бортсеть"
      - resistor:
          ref: R_L5V
          net_pos: VCC_5V
          net_neg: "0"
          value: 200
          description: "Нагрузка на +5В (для работы U7)"
      - resistor:
          ref: R_L3V3
          net_pos: VCC_3V3
          net_neg: "0"
          value: 100
          description: "Нагрузка на +3,3В ≈ 33 мА"
    checks:
      - { node: v(vcc_5v),  min: 4.75, max: 5.25,
          description: "VCC_5V = 5,0В (вход U7)" }
      - { node: v(vcc_3v3), min: 3.20, max: 3.40,
          description: "VCC_3V3 = 3,3В ±3%" }

  - name: PWR_P6
    description: |
      Обратная подача +12В на линию датчиков V5_SENS (J1:17).
      Штатно V5_SENS питается через D4 (SS14) от VCC_5V.
      Аварийный случай: снаружи через разъём приходит +12В.
      Проверяем, что D4 заперт и обратный ток не поднимает
      питание внутренней +5В шины.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VBAT_IN
          type: dc
          value: 14.4
          description: "Номинальная бортсеть"
      - source:
          ref: V2
          net: V5_SENS
          type: dc
          value: 12.0
          description: "Аварийная обратная подача +12В через J1:17"
      - resistor:
          ref: R_L5V
          net_pos: VCC_5V
          net_neg: "0"
          value: 100
          description: "Нагрузка на +5В"
    control: |
      let v5   = v(VCC_5V)
      let vsen = v(V5_SENS)
      print v5 vsen
    checks:
      - { node: v5,   min: 4.75, max: 5.25,
          description: "VCC_5V остаётся 5,0В — D4 блокирует обратную подачу" }
      - { node: vsen, min: 3.0,  max: 5.6,
          description: "V5_SENS ограничен D5 (TVS 5,6В)" }