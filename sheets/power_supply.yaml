# ─────────────────────────────────────────────────────────────────────
# Тестовые сценарии Ngspice
#
# Проверяем ключевые защитные и питающие функции листа:
#
#   PWR_P1 — переполюсовка входа: VBAT_IN = -14В, V(VBAT_PROT) ≈ 0
#   PWR_P2 — load-dump: VBAT_IN = 38,4В через Ri=0,5 Ом,
#            TVS D2 клиппит VCC_12V ≈ 24–26В
#   PWR_P3 — стабильность VCC_5V: VBAT_IN = 14,4В + нагрузка
#   PWR_P5 — стабильность VCC_3V3: VCC_5V подаётся, U7 выдаёт 3,3В
#   PWR_P6 — обратная подача +12В на V5_SENS через J1:17:
#            D4 (SS14) блокирует, V(VCC_5V) не растёт,
#            D5 ограничивает V5_SENS
#
# U6 (MC78M05) и U7 (AMS1117) — subckt-модели в их типах.
# Нагрузки задаются резисторами в deck.
# ─────────────────────────────────────────────────────────────────────

scenarios:

  - name: PWR_P1
    description: |
      Переполюсовка входа: на J1:1,2 подан −14В.
      D1 (SS54) в обратном включении — ток ≈ 0,
      VBAT_PROT и VCC_12V остаются в нуле.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VBAT_IN
          type: dc
          value: -14.0
          description: "Аварийная переполюсовка входа −14В"
    checks:
      - node: v(vbat_prot)
        min: -1.0
        max: 1.0
        description: "VBAT_PROT ≈ 0В: D1 заперт, питания нет"
      - node: v(vcc_12v)
        min: -1.0
        max: 1.0
        description: "VCC_12V ≈ 0В: нет входного питания"

  - name: PWR_P2
    description: |
      Импульс load dump 38,4В через Ri = 0,5 Ом (ISO 7637-2).
      TVS D2 в пробое удерживает VCC_12V в районе 24–26В,
      ток пробоя 20–30А рассеивается на диоде.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VCC_SRC
          type: dc
          value: 38.4
          description: "Импульс load dump 38,4В (пик)"
      - resistor:
          ref: R_LD
          net_pos: VCC_SRC
          net_neg: VCC_12V
          value: 0.5
          description: "Внутреннее сопротивление источника (ISO 7637-2)"
    control: |
      let v12 = v(VCC_12V)
      let id2 = i(V1)
      print v12 id2
    checks:
      - node: v12
        min: 20.0
        max: 28.0
        description: "VCC_12V клиппится TVS в районе 24–26В (BV + I·RS)"
      - node: id2
        min: -40.0
        max: -10.0
        description: "ток пробоя TVS ≈ 20–30А (знак — по соглашению SPICE)"

  - name: PWR_P3
    description: |
      Номинальный режим питания +5В.
      VBAT_IN = 14,4В, U6 (MC78M05) выдаёт +5В.
      Нагрузка имитируется резистором 100 Ом на VCC_5V.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VBAT_IN
          type: dc
          value: 14.4
          description: "Номинальная бортсеть +14,4В"
      - resistor:
          ref: R_L5V
          net_pos: VCC_5V
          net_neg: "0"
          value: 100
          description: "Нагрузка на +5В ≈ 50 мА"
    checks:
      - node: v(vcc_5v)
        min: 4.75
        max: 5.25
        description: "VCC_5V = 5,0В ±5% (выход U6 в норме)"

  - name: PWR_P5
    description: |
      Номинальный режим +3,3В.
      VBAT_IN = 14,4В → U6 → VCC_5V → U7 (AMS1117-3.3) → VCC_3V3.
      Нагрузка 100 Ом на +3,3В (33 мА).
    analysis: op
    deck:
      - source:
          ref: V1
          net: VBAT_IN
          type: dc
          value: 14.4
          description: "Номинальная бортсеть"
      - resistor:
          ref: R_L5V
          net_pos: VCC_5V
          net_neg: "0"
          value: 200
          description: "Нагрузка на +5В (для работы U7)"
      - resistor:
          ref: R_L3V3
          net_pos: VCC_3V3
          net_neg: "0"
          value: 100
          description: "Нагрузка на +3,3В ≈ 33 мА"
    checks:
      - node: v(vcc_5v)
        min: 4.75
        max: 5.25
        description: "VCC_5V = 5,0В (вход U7)"
      - node: v(vcc_3v3)
        min: 3.20
        max: 3.40
        description: "VCC_3V3 = 3,3В ±3%"

  - name: PWR_P6
    description: |
      Обратная подача +12В на линию датчиков V5_SENS (J1:17).
      Штатно V5_SENS питается через D4 (SS14) от VCC_5V.
      Аварийный случай: снаружи через разъём приходит +12В.
      Источник V2 подключён через R_INJ=100 Ом (имитация жгута
      и Ri внешнего драйвера) — TVS D5 в пробое прижимает
      V5_SENS к ~5,6В. Проверяем, что D4 заперт и обратная
      подача не поднимает внутреннюю шину +5В.
    analysis: op
    deck:
      - source:
          ref: V1
          net: VBAT_IN
          type: dc
          value: 14.4
          description: "Номинальная бортсеть +14,4В"
      - source:
          ref: V2
          net: V5_EXT
          type: dc
          value: 12.0
          description: "Аварийная обратная подача +12В через J1:17"
      - resistor:
          ref: R_INJ
          net_pos: V5_EXT
          net_neg: V5_SENS
          value: 100
          description: "Ri жгута и внешнего источника затекания (100 Ом)"
      - resistor:
          ref: R_L5V
          net_pos: VCC_5V
          net_neg: "0"
          value: 100
          description: "Нагрузка на +5В"
    control: |
      let v5   = v(VCC_5V)
      let vsen = v(V5_SENS)
      print v5 vsen
    checks:
      - node: v5
        min: 4.75
        max: 5.25
        description: "VCC_5V остаётся 5,0В — D4 блокирует обратную подачу"
      - node: vsen
        min: 3.0
        max: 6.0
        description: "V5_SENS ограничен D5: BV + I·RS ≈ 5,6…5,7В"