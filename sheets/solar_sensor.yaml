functional_purpose: |
  Модуль измерения солнечной радиации.

  Внешний датчик солнечной радиации питается от +5В (J1:17)
  и выдаёт аналоговый сигнал 0..5В на линию SOLAR_IN_RAW (J1:20).
  Резистивный делитель R27 (10к) / R28 (20к) масштабирует
  сигнал до 0..3,3В для входа АЦП микроконтроллера (SOLAR_ADC).
  Конденсатор C26 фильтрует ВЧ-помехи. Стабилитрон D29 (3,6В)
  защищает вход АЦП от затекания +12В в линию SOLAR_IN_RAW.

  Коэффициент деления:
    K = R28 / (R27 + R28) = 20 / 30 = 2/3

  Характерные точки:
    SOLAR_IN_RAW = 0В    → SOLAR_ADC = 0В    (темнота)
    SOLAR_IN_RAW = 2,5В  → SOLAR_ADC ≈ 1,67В (пасмурно)
    SOLAR_IN_RAW = 5В    → SOLAR_ADC ≈ 3,33В (яркое солнце)
    SOLAR_IN_RAW = 12В   → SOLAR_ADC ≈ 3,7В (ограничен D29)

# Модели R/C не объявляются: на листе только примитивы SPICE,
# строятся по part. D29 — primitive: D с inline .model.

ports:
- net_label: GND
  type: POWER
  description: Общий провод (кузов автомобиля)
- net_label: SOLAR_IN_RAW
  type: INPUT
  description: Вход датчика солнечной радиации (0..5В), J1:20
- net_label: SOLAR_ADC
  type: OUTPUT
  description: Сигнал солнечной радиации после делителя 5В->3,3В на АЦП

component_types:
  TYPE_C_100NF:
    symbol: Device:C
    footprint: Capacitor_SMD:C_0603_1608Metric
    value: 100n
    fields:
      Type: Ceramic
      Dielectric: X7R

  TYPE_R_10K:
    symbol: Device:R
    footprint: Resistor_SMD:R_0603_1608Metric
    value: 10k
    fields:
      Power: 0.1W
      Tolerance: 1%

  TYPE_R_20K:
    symbol: Device:R
    footprint: Resistor_SMD:R_0603_1608Metric
    value: 20k
    fields:
      Power: 0.1W
      Tolerance: 1%

  TYPE_D_ZENER_3V6:
    symbol: Device:D_Zener
    footprint: Diode_SMD:D_SOD-123
    value: BZX84C3V6
    fields: { Voltage: 3.6V }
    spice:
      description: |
        Стабилитрон 3,6В для защиты входа АЦП.
        При V(SOLAR_ADC) < 3,6В — заперт, сигнал идёт через делитель.
        При V > 3,6В (аварийное затекание +12В) — открывается,
        ограничивает SOLAR_ADC на уровне BV + I·Rz ≈ 3,7В.
        Распиновка Device:D_Zener: pin 1 = K, pin 2 = A.
      primitive: D
      model_def: ".model D_ZENER_3V6 D(IS=1e-14 RS=100 N=1.05 BV=3.6 IBV=1m CJO=50p)"

components:
  C26:
    type: TYPE_C_100NF
    description: "Фильтр АЦП сигнала солнечной радиации"
  R27:
    type: TYPE_R_10K
    description: "Делитель сигнала солнечной радиации, верхнее плечо"
  R28:
    type: TYPE_R_20K
    description: "Делитель сигнала солнечной радиации, нижнее плечо"
  D29:
    type: TYPE_D_ZENER_3V6
    description: "Защитный стабилитрон входа АЦП солнечной радиации"

nets:
  GND:
    name: GND
    description: Общий провод (кузов автомобиля)
    is_hierarchical_port: true
    attributes:
      type: GND
      voltage_level: 0V
      current_max: 15A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: R28, pin: '2' }
    - { component: C26, pin: '2' }
    - { component: D29, pinfunction: 'A' }   # анод стабилитрона на GND

  SOLAR_IN_RAW:
    name: SOLAR_IN_RAW
    description: Вход датчика солнечной радиации (0..5В), J1:20
    is_hierarchical_port: true
    attributes:
      type: ANALOG_SIGNAL
      voltage_level: 0..5.0V
      current_max: 0.005A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: R27, pin: '1' }

  SOLAR_ADC:
    name: SOLAR_ADC
    description: Сигнал солнечной радиации после делителя 5В->3,3В на АЦП
    is_hierarchical_port: true
    attributes:
      type: ANALOG_SIGNAL
      voltage_level: 0..3.3V
      current_max: 0.005A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - { component: R27, pin: '2' }
    - { component: R28, pin: '1' }
    - { component: C26, pin: '1' }
    - { component: D29, pinfunction: 'K' }   # катод стабилитрона на ADC

# ─────────────────────────────────────────────────────────────────────
# Тестовые сценарии Ngspice
#
# Делитель R27 (10к) / R28 (20к):
#   K = 20 / (10 + 20) = 2/3
#
# Защитный стабилитрон D29 (BV = 3,6В, Rz ≈ 100 Ом):
#   при V(SOLAR_ADC) < 3,6В — заперт, на сигнал не влияет;
#   при V ≥ 3,6В — открывается, ограничивает узел.
#
# Проверяем:
#   0В  (темнота)   → SOLAR_ADC = 0В
#   2,5В (пасмурно) → SOLAR_ADC ≈ 1,67В
#   5В  (ярко)      → SOLAR_ADC ≈ 3,33В (стабилитрон ещё закрыт)
#   12В (авария)    → SOLAR_ADC ≈ 3,7В (ограничен стабилитроном)
#   обрыв линии     → SOLAR_ADC = 0В (подтянут к GND через R28)
# ─────────────────────────────────────────────────────────────────────

scenarios:

  - name: SEN_SOLAR_DARK
    description: |
      Датчик в темноте, на выходе 0В.
      SOLAR_ADC = 0В.
    analysis: op
    deck:
      - source:
          ref: V1
          net: SOLAR_IN_RAW
          type: dc
          value: 0.0
          description: "Датчик солнечной радиации: темнота (0В)"
    checks:
      - node: v(solar_adc)
        min: -0.05
        max: 0.05
        description: "SOLAR_ADC = 0В (нижний край диапазона)"

  - name: SEN_SOLAR_MID
    description: |
      Средняя освещённость (пасмурно).
      SOLAR_IN_RAW = 2,5В → SOLAR_ADC ≈ 1,67В (K = 2/3).
    analysis: op
    deck:
      - source:
          ref: V1
          net: SOLAR_IN_RAW
          type: dc
          value: 2.5
          description: "Датчик солнечной радиации: середина диапазона (2,5В)"
    checks:
      - node: v(solar_adc)
        min: 1.55
        max: 1.80
        description: "середина диапазона АЦП ≈ 1,67В"

  - name: SEN_SOLAR_BRIGHT
    description: |
      Яркое солнце, датчик на верхнем пределе.
      SOLAR_IN_RAW = 5В → SOLAR_ADC ≈ 3,33В. Стабилитрон ещё заперт
      (BV = 3,6В), на сигнал не влияет.
    analysis: op
    deck:
      - source:
          ref: V1
          net: SOLAR_IN_RAW
          type: dc
          value: 5.0
          description: "Датчик солнечной радиации: максимум (5В)"
    checks:
      - node: v(solar_adc)
        min: 3.20
        max: 3.45
        description: "верхний край диапазона АЦП ≈ 3,33В"

  - name: SEN_SOLAR_FAULT_12V
    description: |
      Аварийный режим: замыкание линии SOLAR_IN_RAW на бортсеть +12В.

      Проверяем, что стабилитрон D29 защищает вход АЦП:
      без него делитель дал бы 12 · 2/3 = 8В, что повредило бы МК.
      С D29 узел SOLAR_ADC ограничен уровнем BV + I·Rz ≈ 3,7В.

      Ток через стабилитрон: (12 − 3,7)/10k ≈ 0,83 мА — безопасен
      для SOD-123 (допустимо до десятков мА при коротких импульсах).
    analysis: op
    deck:
      - source:
          ref: V1
          net: SOLAR_IN_RAW
          type: dc
          value: 12.0
          description: "Аварийная подача +12В на вход датчика"
    control: |
      let vadc = v(SOLAR_ADC)
      let iz   = (12.0 - v(SOLAR_ADC)) / 10k
      print vadc iz
    checks:
      - node: vadc
        min: 3.4
        max: 3.8
        description: "SOLAR_ADC ограничен D29 на уровне ≈ 3,7В (безопасно для STM32)"
      - node: iz
        min: 0.0006
        max: 0.0010
        description: "ток через стабилитрон ≈ 0,83 мА (в пределах нормы SOD-123)"

  - name: SEN_SOLAR_OPEN
    description: |
      Обрыв линии датчика (провод перебит, датчик отключён).
      Линия SOLAR_IN_RAW висит в воздухе, ток через делитель = 0,
      SOLAR_ADC подтягивается к GND через R28 = 20к.
    analysis: op
    deck: []   # источников нет — линия в воздухе
    checks:
      - node: v(solar_adc)
        min: -0.05
        max: 0.05
        description: "SOLAR_ADC = 0В (нет сигнала с датчика)"