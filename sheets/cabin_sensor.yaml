  description: Силовая шина +12В после фильтра помех L1, с TVS D2 и конденсаторами
- net_label: GND
  type: POWER
  description: Общий провод (кузов автомобиля)
- net_label: NTC_CABIN
  type: INPUT
  description: Температура воздуха в салоне (NTC на плате в трубе продувки)
- net_label: M_FAN_CTL
  type: INPUT
  description: Управление мини-вентилятором продувки датчика
component_types:
