      current_max: 0.02A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - component: Q2
      pin: '2'
    - component: J5
      pin: '2'
    - component: D3
      pin: '1'
