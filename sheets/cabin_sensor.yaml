    fields: {}
  TYPE_QNMOS_AO3400:
    symbol: Transistor_FET:AO3400A
    footprint: Package_TO_SOT_SMD:SOT-23
    value: AO3400
    fields: {}
  TYPE_R_1K:
    symbol: Device:R
    footprint: Resistor_SMD:R_0603_1608Metric
    value: 1k
    fields:
      Power: 0.1W
      Tolerance: 1%
  TYPE_R_10K:
    symbol: Device:R
    footprint: Resistor_SMD:R_0603_1608Metric
