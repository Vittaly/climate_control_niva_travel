nets:
  VCC_12V:
    name: VCC_12V
    description: Силовая шина +12В после фильтра помех L1, с TVS D2 и конденсаторами
    is_hierarchical_port: true
    attributes:
      type: POWER
      voltage_level: 12.0V
      current_max: 15A
      spice_simulation:
        model_stimulus: DC 12.0
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - component: J5
      pin: '1'
    - component: D3
      pin: '2'
  GND:
    name: GND
    description: Общий провод (кузов автомобиля)
    is_hierarchical_port: true
    attributes:
      type: GND
      voltage_level: 0V
      current_max: 15A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - component: Q2
      pin: '3'
    - component: RT1
      pin: '2'
    - component: R17
      pin: '2'
  NTC_CABIN:
    name: NTC_CABIN
    description: Температура воздуха в салоне (NTC на плате в трубе продувки)
    is_hierarchical_port: true
    attributes:
      type: ANALOG_SIGNAL
      voltage_level: 0..3.3V
      current_max: 0.005A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - component: RT1
      pin: '1'
  M_FAN_CTL:
    name: M_FAN_CTL
    description: Управление мини-вентилятором продувки датчика
    is_hierarchical_port: true
    attributes:
      type: DIGITAL_SIGNAL
      voltage_level: 3.3V
      current_max: 0.02A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - component: R16
      pin: '1'
  M_FAN_GATE:
    name: M_FAN_GATE
    description: Затвор MOSFET мини-вентилятора
    is_hierarchical_port: false
    attributes:
      type: DIGITAL_SIGNAL
      voltage_level: 3.3V
      current_max: 0.02A
      spice_simulation:
        model_stimulus: ''
        parasitic_r_ohm: 0.05
        parasitic_l_h: 10n
    nodes:
    - component: R16
      pin: '2'
    - component: Q2
      pin: '1'
    - component: R17
      pin: '1'
  SENS_FAN_SW:
    name: SENS_FAN_SW
    description: Коммутируемая линия питания мини-вентилятора
    is_hierarchical_port: false
    attributes:
      type: DIGITAL_SIGNAL
