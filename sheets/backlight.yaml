functional_purpose: |
  Модуль фоновой подсветки шкал ручек управления, подсветки
  кнопок и указателя.

  Все каналы питаются напрямую от ILLUM_IN_RAW (+12В габаритов,
  J1:22), собраны по одной схеме: R (130Ω) + 3 белых LED
  последовательно. Катоды всех каналов объединены на GND.

  Управления яркостью нет — яркость определяется напряжением
  бортсети. Подсветка включается и выключается вместе с
  габаритами автомобиля.

  Группы каналов:
    * 8 шкальных (шкалы ручек ТЕМП и ВЕНТ);
    * 2 канала подсветки кнопок (6 кнопок);
    * 4 канала указателя.

  Все LED — 1206 (для ручной пайки).

  Ток одного канала при 12В: (12 − 3·3,2)/130 ≈ 18,5 мА.
  Суммарный ток: ≈ 260 мА.

  В SPICE:
    * LED11..LED212 — primitive: D с inline .model LED_WHITE;
    * R — примитивы, spice не требуют.

  Полярность LED (KiCad Device:LED):
    pin 1 = K (катод), pin 2 = A (анод).
    Имена выводов уникальны → в nets: адресуются pinfunction 'K'/'A'.
    Внутри канала LED соединены последовательно: A→K→A→K→A→K→GND.
    После резистора R1..R14 стоит АНОД первого LED (pinfunction 'A').

ports:
- net_label: ILLUM_IN_RAW
  type: POWER
  description: Вход внешней подсветки прибора (+12В габаритов автомобиля)
- net_label: GND
  type: POWER
  description: Общая силовая земля схемы

component_types:
  TYPE_R_130R:
    symbol: Device:R
    footprint: Resistor_SMD:R_0603_1608Metric
    value: 130R
    fields:
      Power: 0.1W
      Tolerance: 1%

  TYPE_LED_WHITE:
    symbol: Device:LED
    footprint: LED_SMD:LED_1206_3216Metric
    value: Белый SMD 1206
    fields: { Color: White }
    spice:
      description: |
        Белый светодиод 1206.
        Vf ≈ 3,2В при 20 мА; 3 LED последовательно ≈ 9,6В.
        Используется во всех 14 каналах подсветки.
        Распиновка Device:LED: pin 1 = K (катод), pin 2 = A (анод).
      primitive: D
      model_def: ".model LED_WHITE D(IS=1e-22 N=2.5 RS=6 BV=5 CJO=10p)"

