# ─────────────────────────────────────────────────────────────────────
# Тестовые сценарии Ngspice
#
# Схема: 14 параллельных каналов (8 шкал + 2 кнопки + 4 указателя),
# каждый = R 130Ω + 3 белых LED последовательно, катоды на GND.
#
# Модель LED_WHITE: Vf ≈ 3,2В при 20 мА. 3 LED → 9,6В.
# Ток канала: (12 − 9,6)/130 ≈ 18,5 мА.
# Суммарный ток 14 каналов: ≈ 260 мА.
# ─────────────────────────────────────────────────────────────────────

scenarios:

  - name: BACKLIGHT_ON
    description: |
      Номинальное питание 12В от габаритов.
      Все 14 каналов открыты, каждый проводит ≈ 18 мА.
    analysis: op
    deck:
      - source:
          ref: V1
          net: ILLUM_IN_RAW
          type: dc
          value: 12.0
          description: "Напряжение габаритов +12В"
    control: |
      let ich  = -i(V1) / 14
      let vled = v(ILLUM_IN_RAW) - v(NET_SCALE_CH1_A)
      print ich vled
    checks:
      - { node: ich,  min: 0.012, max: 0.025,
          description: "ток одного канала ≈ 18,5 мА" }
      - { node: vled, min: 1.5,   max: 2.5,
          description: "падение на R1 ≈ 2В (Vпитания − 3·Vf)" }

  - name: BACKLIGHT_HIGH
    description: |
      Повышенное питание 14,4В (бортовая сеть с генератором).
      Ток канала растёт, но остаётся в пределах нормы LED (не более 30 мА).
    analysis: op
    deck:
      - source:
          ref: V1
          net: ILLUM_IN_RAW
          type: dc
          value: 14.4
          description: "Напряжение генератора +14,4В"
    control: |
      let ich = -i(V1) / 14
      print ich
    checks:
      - { node: ich, min: 0.025, max: 0.045,
          description: "ток канала ≈ 36 мА, LED не перегружены" }

  - name: BACKLIGHT_OFF
    description: |
      Габариты выключены, ILLUM_IN_RAW = 0.
      LED не светятся, ток через каналы ≈ 0.
    analysis: op
    deck:
      - source:
          ref: V1
          net: ILLUM_IN_RAW
          type: dc
          value: 0.0
          description: "Габариты выключены"
    control: |
      let itot = -i(V1)
      print itot
    checks:
      - { node: itot, min: -0.0001, max: 0.0001,
          description: "ток отсутствует (каналы заперты)" }