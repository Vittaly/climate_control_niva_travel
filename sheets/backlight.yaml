page_name: BACKLIGHT
file: backlight.kicad_sch
functional_purpose: |
  Модуль фоновой подсветки шкал ручек управления, подсветки
  кнопок и указателя.

  Все каналы питаются напрямую от ILLUM_IN_RAW (+12В габаритов,
  J1:22), собраны по одной схеме: R (130Ω) + 3 белых LED
  последовательно. Катоды всех каналов объединены на GND.

  Управления яркостью нет — яркость определяется напряжением
  бортсети. Подсветка включается и выключается вместе с
  габаритами автомобиля.

  Группы каналов:
    * 8 шкальных (шкалы ручек ТЕМП и ВЕНТ), LED белые 0805;
    * 2 канала подсветки кнопок (6 кнопок), LED белые 1206;
    * 4 канала указателя, LED белые 0603.

  Ток одного канала при 12В: (12 − 3·3,2)/130 ≈ 18,5 мА.
  Суммарный ток: ≈ 260 мА.

ports:
- net_label: ILLUM_IN_RAW
  type: POWER
  description: Вход внешней подсветки прибора (+12В габаритов автомобиля)
- net_label: GND
  type: POWER
  description: Общая силовая земля схемы

component_types:
  TYPE_R_0603_130R:
    symbol: Device:R
    footprint: Resistor_SMD:R_0603_1608Metric
    value: 130R
    fields:
      Power: 0.1W
      Tolerance: 1%
    spice:
      model: R
      description: "Токоограничивающий резистор LED-канала"
  TYPE_LED_0805_WHITE:
    symbol: Device:LED
    footprint: LED_SMD:LED_0805_2012Metric
    value: Белый SMD 0805
    fields: { Color: White }
    spice:
      model: LED_WHITE
  TYPE_LED_1206_WHITE:
    symbol: Device:LED
    footprint: LED_SMD:LED_1206_3216Metric
    value: Белый SMD 1206
    fields: { Color: White }
    spice:
      model: LED_WHITE
  TYPE_LED_0603_WHITE:
    symbol: Device:LED
    footprint: LED_SMD:LED_0603_1608Metric
    value: Белый SMD 0603
    fields: { Color: White }
    spice:
      model: LED_WHITE

